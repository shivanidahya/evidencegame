  h_804:["What’s in 804(b)?","804(b) exceptions apply only to unavailable declarants: former testimony, statements under belief of imminent death, statements against interest, family history, and forfeiture by wrongdoing."],
  h_807:["What’s the residual exception?","807 admits hearsay that no other exception covers if it has sufficient guarantees of trustworthiness, is more probative on the point than other reasonably obtainable evidence, and the proponent gave notice."],
  x_403:["What’s “unfair prejudice”?","Unfair prejudice is an undue tendency to suggest a decision on an improper basis, often an emotional one. 403 excludes evidence only when that danger (or confusion, delay, cumulativeness) substantially outweighs probative value."],
  k_rel:["What’s relevant?","Evidence is relevant if it has any tendency to make a fact more or less probable than it would be without the evidence, and the fact is of consequence in determining the action (401)."],
  k_use:["What’s propensity?","Propensity reasoning goes: the person has a character trait, so they probably acted in line with it this time. 404 bars that chain. Other uses (motive, intent, identity, habit, character as an element) don’t rely on it."],
  k_hudd:["What’s the Huddleston standard?","Before other-act evidence comes in, there must be enough evidence for a jury to reasonably find, by a preponderance, that the act happened and the person did it (104(b)). The judge doesn’t decide it personally."],
  k_413:["What do 413–415 allow?","In sexual-assault and child-molestation cases, evidence that the party committed another such act may be considered for any relevant purpose, including propensity. 403 still applies."],
  k_crim:["What opens the character door?","In a criminal case, only the accused can open the door: by offering his own pertinent trait, or the victim’s. The prosecutor may then respond. In homicide, first-aggressor evidence lets the prosecutor show the victim’s peacefulness."],
  k_form:["What methods does 405 allow?","Character is proved by reputation or opinion on direct. Specific instances may be asked about on cross, or used when character is an essential element of a claim or defense."],
  k_403:["What’s “unfair prejudice”?","An undue tendency to suggest a decision on an improper basis. For character evidence, the main risk is the jury punishing the person for who they are."],
  i_m:["What are the impeachment methods?","Prior convictions (609), specific acts bearing on truthfulness (608(b)), reputation or opinion about truthfulness (608(a)), prior inconsistent statements (613), and bias, motive, or capacity."],
  i_10:["What’s the 10-year clock?","Count from the conviction or the release from confinement for it, whichever is later. More than 10 years puts the conviction under 609(b)."],
  i_old:["What’s the 609(b) test?","An old conviction comes in only if its probative value, supported by specific facts and circumstances, substantially outweighs its prejudicial effect, and the proponent gave reasonable written notice."],
  i_cf:["What’s crimen falsi?","A crime whose elements required proving, or the witness admitting, a dishonest act or false statement: fraud, perjury, false statement. Its label or the way it was committed isn’t enough."],
  i_fel:["What counts as a felony under 609?","A crime punishable by death or by imprisonment for more than one year, judged by the possible punishment, not the actual sentence."],
  i_who:["Why does it matter if the witness is the accused?","An accused who testifies gets a more protective balance under 609(a)(1)(B), because the jury may use the conviction as propensity evidence against him."],
  i_bal:["What’s the 609(a)(1)(B) balance?","The conviction comes in only if its probative value outweighs its prejudicial effect to the defendant. Courts weigh impeachment value, age, similarity to the charged crime, and how central the defendant’s testimony is."],
  i_608b:["What’s “probative of truthfulness”?","Conduct that shows willingness to lie or deceive, like lying on a form, fraud, or false statements. Violence or drug use usually doesn’t bear on truthfulness."],
  i_ext:["What’s extrinsic evidence?","Proof from a source other than the witness being cross-examined: documents, other witnesses, recordings. 608(b) bars it for specific acts offered to show character for truthfulness."],
  i_608a:["What’s 608(a) character evidence?","Reputation or opinion testimony about a witness’s character for truthfulness or untruthfulness, and nothing broader."],
  i_att:["What counts as an attack?","Evidence of untruthful character, such as reputation, opinion, specific acts, or convictions, opens the door to support. Merely contradicting a witness usually doesn’t."],
  i_pis:["What’s substantive use?","Using a prior statement as proof that its contents are true, not just to show the witness is inconsistent. Impeachment-only use calls for a limiting instruction."],
  i_801:["What makes a prior inconsistent statement substantive?","801(d)(1)(A): the declarant testifies and is subject to cross, and the earlier statement was made under penalty of perjury at a trial, hearing, other proceeding, or deposition."],
  i_613:["What’s the 613(b) foundation?","Before extrinsic evidence of a prior inconsistent statement comes in, the witness must get a chance to explain or deny it, and the adverse party a chance to question the witness about it."],
  J_403:["What’s “unfair prejudice”?","An undue tendency to suggest a decision on an improper basis. In impeachment, also consider confusion, wasted time, and protecting witnesses from harassment (611(a))."],
  p_law:["What law governs privilege?","Federal common law governs privilege in federal cases, except in civil cases where state law supplies the rule of decision for a claim or defense. Then state privilege law applies (501)."],
  p_which:["What are the federal privileges?","Attorney-client, work product, adverse spousal testimony, marital communications, psychotherapist-patient, and others recognized “in the light of reason and experience.”"],
  p_ac:["What’s attorney-client privilege?","A confidential communication between client and lawyer (or their agents) made to obtain legal advice. It covers communications, not the underlying facts."],
  p_cf:["What’s the crime-fraud exception?","No privilege covers communications in which the client seeks advice to further a future crime or fraud, whether or not the lawyer knew."],
  p_waive:["What’s waiver?","Voluntary disclosure of privileged material can waive the privilege. 502 limits inadvertent disclosures and subject-matter waiver."],
  p_st:["What’s the spousal testimonial privilege?","A spouse may refuse to testify against the other spouse in a criminal case. Under Trammel, the witness-spouse holds the privilege."],
  p_mc:["What’s the marital communications privilege?","Protects confidential communications made between spouses during a valid marriage. It doesn’t cover observations or communications made in front of others."],
  p_psy:["What’s the psychotherapist privilege?","Protects confidential communications made to a licensed psychotherapist or clinical social worker for treatment (Jaffee)."],
  cf_crim:["Who does the Clause protect?","The Sixth Amendment gives the accused in a criminal prosecution the right to confront the witnesses against him. It doesn’t apply in civil cases, and an accused’s own words aren’t a “witness against” him."],
  cf_test:["What’s “testimonial”?","A statement is testimonial when, viewed objectively, its primary purpose is to establish or prove past events for possible later prosecution. Formal statements to police, affidavits, and prior testimony are core examples."],
  cf_avail:["What counts as cross-examination at trial?","The declarant takes the stand at this trial and answers questions. A witness with memory loss who still testifies is subject to cross (Owens)."],
  cf_prior:["What’s a prior opportunity to cross?","For an absent declarant, the Clause requires unavailability plus an earlier chance for this defendant to cross-examine, as at a preliminary hearing, deposition, or earlier trial."],
  cf_exc:["What are the exceptions to the Clause?","Forfeiture by wrongdoing (the defendant made the witness unavailable intending to prevent testimony), statements not offered for their truth, and possibly dying declarations. “Opening the door” isn’t one."]
};

const REMOVED_TOPICS = ["op","auth","be"];
const TKEYS = Object.keys(TOPICS);
const LEVELS = {1:"Rookie",2:"Associate",3:"Trial-Ready",4:"Exam-Ready"};
const LVDESC = {1:"single issue",2:"one rule, harder facts",3:"multi-issue",4:"everything mixed · 1.5× points"};

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const isFRE = r => /^FRE\s/.test(r);
const bare = r => String(r).replace(/^FRE\s+/, "");

// ---------- Claude grading (sample capability) ----------

// ---------- state (v1 shape kept; new fields added, nothing removed) ----------
const KEY = "evidence-locker-v1";
const blankT = () => ({hc:0,ha:0,dc:0,da:0,cc:0,ca:0});
function fresh(){ const t = {}; TKEYS.forEach(k => t[k] = blankT()); return {v:1,pts:0,streak:0,best:0,t,hs:{},ds:{},bs:{},sprint:0,known:{},rl:{},hints:0,pref:{cite:true},rlFilled:true,scope2:true}; }
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.v === 1){
      TKEYS.forEach(k => { s.t[k] = Object.assign(blankT(), s.t[k] || {}); });
      s.bs = s.bs || {}; s.rl = s.rl || {}; s.hints = s.hints || 0; s.pref = Object.assign({cite:true}, s.pref || {}); s.known = s.known || {}; s.ds = s.ds || {}; s.hs = s.hs || {};
      if (!s.rlFilled){ backfillRules(s); s.rlFilled = true; }
      if (!s.scope2){ pruneScope(s); s.scope2 = true; }
      return s; } } catch(e){}
  return fresh();
}
// Scope change (Nov 2026): drop history for removed topics (opinion 701–706; anything after 807), keep everything else
function pruneScope(s){
  REMOVED_TOPICS.forEach(k => delete s.t[k]);
  const hyp = new Set(HYPOS.map(h => h.id)), dr = new Set(DRILLS.map(d => d.id)), cards = new Set(CARDS.map(c => c[0]));
  Object.keys(s.hs).forEach(id => { if (!hyp.has(id)) delete s.hs[id]; });
  Object.keys(s.ds).forEach(id => { if (!dr.has(id)) delete s.ds[id]; });
  Object.keys(s.bs).forEach(id => { if (!dr.has(id)) delete s.bs[id]; });
  Object.keys(s.known).forEach(k => { if (!cards.has(k)) delete s.known[k]; });
  Object.keys(s.rl).forEach(k => { const n = parseInt(k, 10); if (n >= 700 && n <= 706 || n >= 900) delete s.rl[k]; });
  // drills that moved to the Confrontation map keep their clean/off-course status; their old hearsay-map
  // results were Confrontation answers anyway, so we leave the per-topic totals as recorded.
}
// Rule-level history from progress saved before rule logging existed
function backfillRules(s){
  HYPOS.forEach(h => { if (h.id in s.hs) h.r.filter(isFRE).forEach(r => logRuleTo(s, bare(r), s.hs[h.id] === 1)); });
  DRILLS.forEach(d => { if (s.ds[d.id] === 1) solve(d).seq.forEach(([n]) => { const k = (STEP_HELP[n] || [[]])[0][0]; if (k) logRuleTo(s, k, true); }); });
}
function logRuleTo(s, k, ok){ const e = s.rl[k] || (s.rl[k] = {c:0,a:0,t:0}); e.a++; if (ok) e.c++; e.t = Date.now(); }
function logRule(k, ok){ logRuleTo(S, k, ok); }
let S = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

function rank(p){ let r = RANKS[0], nx = null; for (let i = 0; i < RANKS.length; i++){ if (p >= RANKS[i][0]) { r = RANKS[i]; nx = RANKS[i+1] || null; } } return {name:r[1], at:r[0], next:nx}; }
function award(n, ok){
  if (ok === true) { S.streak++; S.best = Math.max(S.best, S.streak); } else if (ok === false) S.streak = 0;
  S.pts += n; save(); renderStats();
  if (n > 0) toast(`+${n} pts${ok && S.streak > 1 ? ` · streak ×${S.streak}` : ""}`);
  else if (ok === false) toast("Streak reset");
}
let tt; function toast(m){ const el = $("#toast"); el.textContent = m; el.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("on"), 1700); }
function renderStats(){
  const r = rank(S.pts);

}
function acc(k){ const t = S.t[k]; const a = t.ha + t.da, c = t.hc + t.dc; return {a, c, p: a ? Math.round(100 * c / a) : null}; }

function ruleBlock(raw){
  const f = findRule(raw); if (!f) return "";

    ${num ? `<a class="cornell" href="${CORNELL(base)}" target="_blank" rel="noopener">Full text of Rule ${base} on Cornell LII ↗</a>` : ""}</section>`;
}
function openWhy(title, lead, keys){

}

// ---------- CITATION GRADING ----------
// 1 = exact (or more specific than the key) · 0.5 = right rule, not specific enough · 0.25 = right rule number, different subdivision · 0 = miss
function gradeCite(input, keys){
  const tries = String(input).split(/[,;]|\band\b|\s\/\s/i).map(x => x.trim()).filter(Boolean);
  let best = {score:0, label:"miss"};
  tries.forEach(t => { const a = parseCite(t); if (!a) return; if (CONF_CASES.has(a.num)) { a.num = "6A"; a.parts = []; }
    keys.forEach(kr => { const b = parseCite(kr); if (!b || a.num !== b.num) return;
      let i = 0; while (i < a.parts.length && i < b.parts.length && a.parts[i] === b.parts[i]) i++;
      let sc, label;
      if (i === b.parts.length) { sc = 1; label = "exact"; }
      else if (i === a.parts.length) { sc = 0.5; label = "general"; }
      else { sc = 0.25; label = "near"; }
      if (sc > best.score) best = {score:sc, label, key:kr};
    }); });
  return best;
}
// Citing a Confrontation case counts as citing the Sixth Amendment
const CONF_CASES = new Set(["Crawford","Davis","Hammon","Bryant","Melendez-Diaz","Bullcoming","Clark","Giles","Bruton","Hemphill","Street","Owens"]);
const CITE_MSG = {exact:"Full credit. That’s the controlling rule.", general:"Partial credit. Right rule, but cite the specific subdivision.", near:"Close. Right rule number, but a different subdivision controls.", miss:"Not the controlling rule.", skip:"Skipped."};

function treeHTML(m, sol, o){

  const c = R.deck[R.i]; const front = R.reverse ? c[1] : c[0], back = R.reverse ? c[0] : c[1];
  b.innerHTML = `<div class="flash"><button class="fcard" id="rFlip" aria-label="Flip card">
      ${!R.flip ? (R.reverse ? `<span class="back">${esc(front)}</span>` : `<span class="front">${esc(front)}</span>`) : (R.reverse ? `<span class="front">${esc(back)}</span>` : `<span class="back">${esc(back)}</span>`)}
      <span class="hint">${R.flip ? TOPICS[c[2]].n : "Tap to flip"}</span></button></div>
    <div class="row spread"><span class="mono muted" style="font-size:12px">Card ${R.i + 1} of ${R.deck.length}${S.known[c[0]] ? " · known" : ""}</span>
      <div class="row">${R.flip && findRule(c[0]) ? whyBtn(`data-rule="${esc(c[0])}"`, "Rule text") : ""}<button class="btn" id="rMiss" ${R.flip ? "" : "disabled"}>Again</button><button class="btn primary" id="rKnow" ${R.flip ? "" : "disabled"}>Got it</button></div></div>`;
}
function spQuestion(){
  const c = CARDS[Math.floor(Math.random() * CARDS.length)];
  const same = shuffle(CARDS.filter(x => x[0] !== c[0] && x[2] === c[2])), other = shuffle(CARDS.filter(x => x[0] !== c[0] && x[2] !== c[2]));
  const opts = shuffle([c].concat(same.concat(other).slice(0,3)));
  R.sp.q = {c, opts, picked:null};
}
function renderSprint(){
  const b = $("#rbody"), sp = R.sp;
  if (!sp || sp.over){
    b.innerHTML = `<div class="panel" style="display:grid;gap:12px"><span class="eyebrow">60 seconds</span><h3>${sp && sp.over ? `Time. ${sp.score} correct${sp.score > 0 && sp.score >= S.sprint ? " (new best)" : ""}` : "Match the language to the rule number"}</h3>
      <p class="muted" style="margin:0">Each correct match is worth 3 points. A wrong pick shows the right answer before moving on.</p><div class="row"><button class="btn primary" id="spGo">${sp ? "Run it again" : "Start the clock"}</button></div></div>`; return;
  }
  const q = sp.q;
  b.innerHTML = `<div class="panel" style="display:grid;gap:14px"><div class="row spread"><span class="clock">${sp.time}s</span><span class="mono">Score <b>${sp.score}</b></span></div>
    <p class="sprint-q">${esc(q.c[1])}</p>
    <div class="sp-opts">${q.opts.map(o => { let cls = ""; if (q.picked){ if (o[0] === q.c[0]) cls = "right"; else if (o[0] === q.picked) cls = "wrong"; } return `<button data-sp="${esc(o[0])}" class="${cls}" ${q.picked ? "disabled" : ""}>${esc(o[0].replace("FRE ",""))}</button>`; }).join("")}</div></div>`;
}
function startSprint(){
  clearInterval(R.sp && R.sp.timer);
  R.sp = {time:60, score:0, q:null, over:false}; spQuestion();
  R.sp.timer = setInterval(() => { R.sp.time--; if (R.sp.time <= 0){ clearInterval(R.sp.timer); R.sp.over = true;
    const pts = R.sp.score * 3; if (R.sp.score > S.sprint) S.sprint = R.sp.score; S.pts += pts; save(); renderStats(); if (pts) toast(`+${pts} pts`); renderReview(); }
    else { const c = $(".clock"); if (c) c.textContent = R.sp.time + "s"; } }, 1000);
  renderSprint();
}
function pickSprint(r){
  const q = R.sp.q; if (q.picked || R.sp.over) return; q.picked = r;
  logRule(bare(q.c[0]), r === q.c[0]);
  if (r === q.c[0]){ R.sp.score++; spQuestion(); renderSprint(); }
  else { renderSprint(); setTimeout(() => { if (!R.sp.over){ spQuestion(); renderSprint(); } }, 900); }
}

// ---------- events ----------
document.addEventListener("click", e => {
  const t = e.target.closest("button, a"); if (!t) return;
  const d = t.dataset;
  if (t.id === "why-close" || t.id === "why-scrim"){ closeWhy(); return; }
  if (d.rule){ openWhy("Rule text", "", [d.rule]); return; }
  if (d.whyNode){ const nd = nodeOf(d.whyNode); const help = STEP_HELP[d.whyNode] || [[], ""]; openWhy(nd.s + " · " + nd.rule, help[1] + " " + "Question: " + nd.q, help[0]); return; }
  if (d.whyOpt !== undefined){ const h = H.deck[H.i]; const o = h.o[+d.whyOpt]; openWhy(o[1] ? "Why this answer is right" : "Why this answer is wrong", o[2], h.r); return; }
  if (d.goHypo){ H.topic = d.goHypo; H.lv = 4; H.deck = []; location.hash = "#hypos"; if (location.hash === "#hypos") route(); return; }
  if (d.goMap){ D.map = d.goMap; D.sc = null; location.hash = "#maps"; route(); return; }
  if (t.id === "resetAsk"){ confirmReset = true; renderDesk(); return; }
  if (t.id === "resetNo"){ confirmReset = false; renderDesk(); return; }
  if (t.id === "resetYes"){ S = fresh(); save(); confirmReset = false; H.deck = []; R.deck = []; renderStats(); renderDesk(); toast("Progress erased"); return; }
  if (d.ht){ H.topic = d.ht; H.deck = []; renderHypos(); return; }
  if (d.hl){ H.lv = +d.hl; H.deck = []; renderHypos(); return; }
  if (t.id === "citeToggle"){ S.pref.cite = !S.pref.cite; save(); if (H.stage === "cite" && !S.pref.cite) H.stage = "mc"; renderHypos(); return; }
  if (t.id === "citeGo"){ submitCite(false); return; }
  if (t.id === "citeSkip"){ submitCite(true); return; }
  if (d.ho !== undefined){ answerHypo(+d.ho); return; }
  if (t.id === "writeGo"){ submitWrite(); return; }
  if (t.id === "writeStop"){ if (H.ctl) H.ctl.abort(); return; }
  if (t.id === "writeSkip"){ if (H.ctl) H.ctl.abort(); H.write = null; H.stage = "done"; renderHypoCard(); return; }
  if (d.self !== undefined){ finishWrite({by:"self", score:+d.self}); return; }
  if (t.id === "hHint"){ const h = H.deck[H.i]; if (HINTS[h.id] && H.hints < HINTS[h.id].length){ H.hints++; S.hints++; save(); renderHypoCard(); } return; }
  if (t.id === "hNext" || t.id === "hSkip"){ H.i++; resetCard(); renderHypoCard(); $("#hypo-card").scrollIntoView({block:"start",behavior:"smooth"}); return; }
  if (t.id === "hRestart"){ H.deck = []; renderHypos(); return; }
  if (d.map){ D.map = d.map; D.sc = null; renderMaps(); return; }
  if (t.id === "mBack"){ D.map = null; renderMaps(); return; }
  if (d.sc){ startDrill(d.sc); return; }
  if (t.id === "mRandom"){ const list = DRILLS.filter(x => x.map === D.map); const open = list.filter(x => !cleanOf(x.id)); const pick = shuffle(open.length ? open : list)[0]; startDrill(pick.id); return; }
  if (d.cp !== undefined){ pickCheck(+d.cp); return; }
  if (d.ans !== undefined){ pickAnswer(+d.ans); return; }
  if (d.rs !== undefined){ pickReason(d.rs); return; }
  if (t.id === "wCont"){ continueAfterFb(); return; }
  if (d.def){ if (!W.defs.has(d.def)) W.defs.add(d.def); else { const box = t.closest(".stepq").querySelector(".defbox"); if (box) box.scrollIntoView({block:"nearest"}); return; } renderDrill(); return; }
  if (t.id === "idCheck"){ const o = W.sel; if (o) submitId(o); return; }
  if (t.id === "idSwitch"){ W.idMode = W.idMode === "highlight" ? "sentence" : "highlight"; W.sel = null; renderDrill(); return; }
  if (d.sent !== undefined){ const r = sentences(W.sc.facts)[+d.sent]; submitId(r); return; }
  if (d.idmc){ submitId(null, d.idmc); return; }
  if (d.whyKeys){ openWhy(d.whyTitle || "Why?", "", d.whyKeys.split("|")); return; }
  if (t.id === "dHint"){ if (HINTS[D.sc.id] && D.hints < HINTS[D.sc.id].length){ D.hints++; S.hints++; save(); renderDrill(); } return; }
  if (t.id === "dExit"){ D.sc = null; W = null; renderMaps(); return; }
  if (t.id === "dCompact"){ D.compact = !D.compact; renderDrill(); return; }
  if (t.id === "dRetry"){ startDrill(D.sc.id); return; }
  if (t.id === "dNext"){ const list = DRILLS.filter(x => x.map === D.map && x.id !== D.sc.id); const open = list.filter(x => !cleanOf(x.id)); const pick = shuffle(open.length ? open : list)[0]; if (pick) startDrill(pick.id); else { D.sc = null; renderMaps(); } return; }
  if (d.rm){ R.mode = d.rm; if (R.mode === "cards" && R.sp){ clearInterval(R.sp.timer); R.sp = null; } renderReview(); return; }
  if (d.rt){ R.topic = d.rt; cardDeck(); renderReview(); return; }
  if (t.id === "rRev"){ R.reverse = !R.reverse; R.flip = false; renderReview(); return; }
  if (t.id === "rFlip"){ R.flip = !R.flip; renderFlash(); return; }
  if (t.id === "rKnow"){ S.known[R.deck[R.i][0]] = 1; logRule(bare(R.deck[R.i][0]), true); save(); R.i++; R.flip = false; renderReview(); return; }
  if (t.id === "rMiss"){ const c = R.deck[R.i]; delete S.known[c[0]]; logRule(bare(c[0]), false); save(); R.deck.push(c); R.i++; R.flip = false; renderFlash(); return; }
  if (t.id === "rAgain"){ cardDeck(); renderFlash(); return; }
  if (t.id === "spGo"){ startSprint(); return; }
  if (d.sp){ pickSprint(d.sp); return; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#why").hidden){ closeWhy(); return; }
  if (e.target.matches("input,textarea")) return;
  if (!$("#v-hypos").hidden && H.stage === "mc" && /^[a-d]$/i.test(e.key)){ const pos = "abcd".indexOf(e.key.toLowerCase()); const oi = H.order[pos]; if (H.deck[H.i] && oi !== undefined) answerHypo(oi); }
  if (!$("#v-hypos").hidden && H.stage === "done" && e.key === "Enter"){ const b = $("#hNext"); if (b) b.click(); }
});

save(); renderStats(); route();
</script>
</body></html>
