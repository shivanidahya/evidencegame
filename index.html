<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>Evidence Locker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Zilla+Slab:wght@500;600;700&display=swap">
<style>
/* Layout: an evidence-room desk. A locker-green header band with docket stats; below it, one working surface per view.
   Exhibit stickers (yellow for hypos, blue for drills) and appellate stamps carry the case-file theme. */
:root{
  --bg:#eef0ec; --card:#ffffff; --ink:#1b2422; --muted:#5a6762; --line:#cdd5d0; --soft:#e2e7e3;
  --locker:#22403a; --locker-ink:#eef3f0; --locker-dim:#a9c0b8;
  --tag:#f2c418; --tag2:#3c78c4; --on-tag:#1a1a14;
  --ok:#1e7a4c; --ok-soft:#dcefe4; --bad:#b0281f; --bad-soft:#f7dfdc; --route:#7a5a12; --route-soft:#f6ecd2;
  --f-display:"Zilla Slab", "Rockwell", Georgia, serif;
  --f-body:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111816; --card:#18211e; --ink:#e4ebe7; --muted:#9aaaa3; --line:#2d3a36; --soft:#1f2a27;
  --locker:#16302b; --locker-ink:#e8f0ec; --locker-dim:#8fb0a5;
  --tag:#e6b812; --tag2:#5f98e0; --on-tag:#15140c;
  --ok:#4cc48a; --ok-soft:#173a2a; --bad:#ff7a6b; --bad-soft:#41201c; --route:#e2bd5c; --route-soft:#3a3018;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111816; --card:#18211e; --ink:#e4ebe7; --muted:#9aaaa3; --line:#2d3a36; --soft:#1f2a27;
  --locker:#16302b; --locker-ink:#e8f0ec; --locker-dim:#8fb0a5;
  --tag:#e6b812; --tag2:#5f98e0; --on-tag:#15140c;
  --ok:#4cc48a; --ok-soft:#173a2a; --bad:#ff7a6b; --bad-soft:#41201c; --route:#e2bd5c; --route-soft:#3a3018;
  color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--locker)}
button{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:1.55rem} h3{font-size:1.15rem}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.eyebrow{font:600 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:3px solid var(--tag2);outline-offset:2px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--locker);color:var(--locker-ink);border-bottom:4px solid var(--tag)}
.top .row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px 0}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:1.5rem;font-weight:700;letter-spacing:.01em}
.brand .eyebrow{color:var(--locker-dim)}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 12px/1 var(--f-mono);padding:7px 9px;border:1px solid color-mix(in srgb,var(--locker-ink) 25%,transparent);border-radius:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip b{color:var(--tag);font-weight:600}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav.tabs a{color:var(--locker-dim);text-decoration:none;font:600 14px/1 var(--f-display);letter-spacing:.02em;padding:11px 14px 10px;border-radius:6px 6px 0 0;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--bg);color:var(--ink)}
nav.tabs a:hover:not([aria-current]){color:var(--locker-ink)}

main{padding-block:24px 64px}
section.view{display:grid;gap:20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.lede{max-width:65ch;color:var(--muted);margin:6px 0 0}

/* buttons & filters */
.btn{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:5px;cursor:pointer;font-weight:600;font-size:15px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--locker);color:var(--locker-ink);border-color:var(--locker)}
.btn.primary:hover{filter:brightness(1.15)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;font-size:13px}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters .lbl{margin-right:4px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font:600 13px/1.2 var(--f-body);cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* desk */
.rankbar{display:grid;gap:8px}
.meter{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--tag);border-radius:999px;transition:width .4s}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px}
.tcard{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px;cursor:pointer;display:grid;gap:8px;position:relative}
.tcard:hover{border-color:var(--ink)}
.tcard .nm{font:600 1.05rem/1.2 var(--f-display)}
.tcard .rr{font:12px/1.2 var(--f-mono);color:var(--muted)}
.tcard .acc{display:flex;justify-content:space-between;font:600 12px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px}
.badge{font:600 10px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:3px;justify-self:start}
.badge.weak{background:var(--bad-soft);color:var(--bad)}
.badge.thin{background:var(--soft);color:var(--muted)}
.badge.good{background:var(--ok-soft);color:var(--ok)}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:600 13px/1.2 var(--f-mono)}
.chain span{background:var(--soft);padding:6px 9px;border-radius:4px}
.chain em{font-style:normal;color:var(--muted)}
.flags{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.flags li{border-left:3px solid var(--tag);padding:2px 0 2px 12px}
.flags b{font-family:var(--f-display);font-weight:600;font-size:1.02rem;display:block}
.flags p{margin:2px 0 0;color:var(--muted);max-width:70ch}

/* case file card */
.casefile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cf-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px dashed var(--line)}
.sticker{background:var(--tag);color:var(--on-tag);font:600 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:6px 8px;border-radius:3px}
.sticker.blue{background:var(--tag2);color:#fff}
.cf-head h3{margin-right:auto}
.lv{font:600 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cf-body{padding:18px 20px 20px;display:grid;gap:14px}
.facts{margin:0;max-width:70ch}
.ask{font:600 1.05rem/1.4 var(--f-display);margin:0}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:5px;padding:12px;cursor:pointer;align-items:start}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .k{font:600 13px/26px var(--f-mono);text-align:center;border:1px solid var(--line);border-radius:4px;height:26px}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:var(--card);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--card);border-color:var(--bad)}
.opt .why{display:block;margin-top:6px;font-size:14px;color:var(--muted)}
.opt .why b{color:var(--ink)}
.verdict{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.stamp{font:700 1.25rem/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase;border:3px solid currentColor;padding:6px 12px;border-radius:4px;transform:rotate(-5deg);animation:stamp .28s ease-out}
.stamp.ok{color:var(--ok)} .stamp.no{color:var(--bad)}
@keyframes stamp{from{transform:rotate(-5deg) scale(1.6);opacity:0}to{transform:rotate(-5deg) scale(1);opacity:1}}
.analysis{background:var(--soft);border-radius:5px;padding:14px 16px}
.analysis ol{margin:6px 0 0;padding-left:20px}
.analysis li{margin:3px 0}
.cites{display:flex;flex-wrap:wrap;gap:6px}
.cite{font:600 12px/1 var(--f-mono);padding:6px 8px;border:1px solid var(--line);border-radius:3px;background:var(--card)}
.src{font-style:italic;color:var(--muted);font-size:14px}
.cf-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line);background:var(--soft)}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);font:600 14px/1 var(--f-mono);padding:12px 14px;border-radius:5px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:20}
.toast.on{opacity:1;transform:none}

/* maps */
.maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}
.mcard{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:16px;cursor:pointer;display:grid;gap:6px}
.mcard:hover{border-color:var(--ink)}
.mcard .bl{font:12px/1.4 var(--f-mono);color:var(--muted)}
.sclist{display:grid;gap:6px}
.scrow{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:5px;padding:10px 12px;cursor:pointer}
.scrow:hover{border-color:var(--ink)}
.scrow .st{margin-left:auto;font:600 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.trail{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:12px/1.2 var(--f-mono)}
.trail span{background:var(--soft);padding:5px 8px;border-radius:3px}
.trail em{font-style:normal;color:var(--muted)}
.stepq{border:2px solid var(--ink);border-radius:var(--r);padding:16px;display:grid;gap:10px;background:var(--card)}
.stepq .n{font:600 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.choice{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:5px;padding:11px 12px;cursor:pointer}
.choice:hover{border-color:var(--ink);background:var(--soft)}
.result{display:grid;gap:12px}
.offcourse{border-left:4px solid var(--bad);background:var(--bad-soft);padding:12px 14px;border-radius:0 5px 5px 0}
.oncourse{border-left:4px solid var(--ok);background:var(--ok-soft);padding:12px 14px;border-radius:0 5px 5px 0}
.walk{margin:0;padding-left:22px;display:grid;gap:8px}
.walk li.bad{color:var(--bad)}
.walk .a{font-weight:600}
.walk .note{display:block;color:var(--muted);font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font:12px/1.2 var(--f-mono);color:var(--muted);align-items:center}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px}
.treebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:16px}
.tree{min-width:520px;font-size:14px}
.tree ul{list-style:none;margin:6px 0 0 10px;padding:0 0 0 16px;border-left:2px solid var(--line)}
.tree li{position:relative;padding:5px 0 5px 14px}
.tree li::before{content:"";position:absolute;left:-16px;top:17px;width:26px;border-top:2px solid var(--line)}
.tree li.c::before{border-top:3px solid var(--ok)}
.tree li.w::before{border-top:3px dashed var(--bad)}
.edge{display:inline-block;font:600 12px/1.3 var(--f-mono);padding:3px 7px;border-radius:3px;border:1px solid var(--line);background:var(--card);margin-bottom:5px}
li.c>.edge{background:var(--ok);color:var(--card);border-color:var(--ok)}
li.w>.edge{background:var(--bad-soft);color:var(--bad);border:1px dashed var(--bad);text-decoration:line-through}
li.dim>.edge{color:var(--muted)}
.leads{font:12px/1.3 var(--f-mono);color:var(--muted);margin-left:6px}
.dn{border:1px solid var(--line);background:var(--card);border-radius:5px;padding:8px 10px;max-width:440px}
.dn .rq{font:600 11px/1 var(--f-mono);color:var(--muted);letter-spacing:.05em;display:block;margin-bottom:4px}
.dn.c{border:2px solid var(--ok)}
.dn.d{border:2px solid var(--bad);box-shadow:0 0 0 4px var(--bad-soft)}
.dn .flag{display:inline-block;font:600 10px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;background:var(--bad);color:var(--card);padding:4px 6px;border-radius:3px;margin-bottom:6px}
.tn{display:inline-block;border-radius:4px;padding:6px 9px;font:600 13px/1.3 var(--f-body);border:1px solid transparent}
.tn.in{background:var(--ok-soft);color:var(--ok)}
.tn.out{background:var(--bad-soft);color:var(--bad)}
.tn.route{background:var(--route-soft);color:var(--route)}
.tn.c{border:2px solid var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.tn.s:not(.c){border:2px dashed var(--bad)}
.tn .who{font:600 10px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;margin-left:6px;opacity:.85}
.jump{display:inline-block;font:600 12px/1.3 var(--f-mono);padding:5px 8px;border-radius:3px;border:1px dashed var(--line);color:var(--muted)}
.jump.c{border:2px solid var(--ok);color:var(--ok)}
.jump.w{border:2px dashed var(--bad);color:var(--bad)}
.station{margin-top:18px;padding-top:12px;border-top:1px dashed var(--line)}
.station .sh{font:600 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}

/* review */
.flash{perspective:1200px;min-height:220px}
.fcard{position:relative;min-height:220px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);cursor:pointer;display:grid;place-items:center;padding:28px;text-align:center;width:100%}
.fcard .front{font:700 clamp(2rem,7vw,3.2rem)/1 var(--f-display)}
.fcard .back{font-size:1.08rem;max-width:60ch;text-align:left}
.fcard .hint{position:absolute;bottom:10px;left:0;right:0;font:11px/1 var(--f-mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.sprint-q{font-size:1.05rem;max-width:65ch;min-height:4.8em}
.sp-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px}
.sp-opts button{font:600 15px/1 var(--f-mono);padding:14px 10px;border:1px solid var(--line);background:var(--card);border-radius:5px;cursor:pointer}
.sp-opts button:hover{border-color:var(--ink)}
.sp-opts button.right{background:var(--ok);color:var(--card);border-color:var(--ok)}
.sp-opts button.wrong{background:var(--bad);color:var(--card);border-color:var(--bad)}
.clock{font:700 2rem/1 var(--f-mono);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* phase 1: cite, write, judge, why */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stepbox{border:2px solid var(--ink);border-radius:var(--r);padding:14px;display:grid;gap:10px;background:var(--card)}
.stepbox .n,.stepn{font:600 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cite-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cite-in{flex:1 1 200px;min-width:0;font:600 16px/1 var(--f-mono);padding:11px 12px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink)}
textarea{width:100%;font:16px/1.5 var(--f-body);padding:10px 12px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);resize:vertical}
.citeres{margin:0;padding:10px 12px;border-radius:5px;font-size:14px;border-left:4px solid var(--line);background:var(--soft)}
.citeres.exact{border-color:var(--ok);background:var(--ok-soft)}
.citeres.general,.citeres.near{border-color:var(--tag);background:var(--route-soft)}
.citeres.miss{border-color:var(--bad);background:var(--bad-soft)}
.optwrap{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:start}
.opt.picked{border-color:var(--ink);border-width:2px}
.why-btn{font:600 11px/1 var(--f-mono);letter-spacing:.04em;padding:5px 7px;border:1px solid var(--tag2);color:var(--tag2);background:transparent;border-radius:3px;cursor:pointer;white-space:nowrap;vertical-align:middle}
.why-btn:hover{background:var(--tag2);color:#fff}
.judge{display:grid;gap:8px;justify-items:start}
.bench{margin:0;padding:10px 12px;border-radius:5px;background:var(--route-soft);border-left:4px solid var(--route);font-style:italic}
.bench .eyebrow{display:block;font-style:normal;color:var(--route);margin-bottom:4px}
.gradecard{border:1px solid var(--line);border-radius:5px;padding:12px 14px;display:grid;gap:4px}
.gl{margin:2px 0;font-size:14px}.gl.ok b{color:var(--ok)}.gl.miss b{color:var(--route)}.gl.bad b{color:var(--bad)}
button.cite{cursor:pointer}button.cite:hover{border-color:var(--tag2);color:var(--tag2)}
#why{position:fixed;inset:0;z-index:30}
#why-scrim{position:absolute;inset:0;background:rgba(10,16,14,.45);border:0;cursor:default}
.why-panel{position:absolute;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--card);border-left:4px solid var(--tag);overflow-y:auto;display:grid;align-content:start;gap:12px;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 20px}
.why-panel h3{margin-top:4px}.why-panel .lead{margin:4px 0 0;color:var(--muted)}
.rb{border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:6px}
.rb h4{margin:0;font:600 1.02rem/1.25 var(--f-display)}
.rb blockquote{margin:0;padding:8px 12px;border-left:3px solid var(--tag2);background:var(--soft);border-radius:0 4px 4px 0}
.rb blockquote p{margin:3px 0;font-size:15px}
.rb p{margin:0}.tip{font-size:14px}
.cornell{font:600 12px/1.4 var(--f-mono);color:var(--tag2)}
/* journey maps: answer your way down */
.walkgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.walkgrid{grid-template-columns:1fr}}
.wmain{display:grid;gap:12px;min-width:0}
.stepq.seq{border-color:var(--tag2)}
.stepq.seq .n{color:var(--tag2)}
.youans{margin:0;font-size:15px}
.okline{display:grid;gap:4px;padding:10px 12px;border-radius:5px;background:var(--ok-soft);border-left:4px solid var(--ok);font-size:14px}
.okline b{color:var(--ok)}
.fbcard{border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;border-left:5px solid}
.fbcard p{margin:0}
.fbcard.bad{background:var(--bad-soft);border-color:var(--bad)}
.fbcard.half{background:var(--route-soft);border-color:var(--tag)}

<script>
// ===== PRACTICE HYPOS =====
// t: topics, lv: 1 Rookie (single issue) · 2 Associate · 3 Trial-Ready (multi-issue / exam style)
// o: [option text, correct?, why]
const HYPOS = [
/* ---------- RELEVANCE 401–403 + 407–411 ---------- */
{id:"rel1",t:["rel"],lv:1,title:"The 9mm Purchase",
facts:"Dana is on trial for a murder committed with a 9mm handgun. The prosecution offers a gun-shop receipt showing Dana bought a 9mm pistol two weeks before the shooting. The defense objects: “Thousands of people own 9mm pistols — this proves nothing.”",
q:"How should the court rule on the relevance objection?",
o:[["Overruled — the purchase has some tendency to make it more probable Dana was the shooter, and that fact is of consequence.",true,"401 asks only for “any tendency.” The receipt shows means and opportunity; it doesn’t have to prove guilt on its own. As the saying goes, a brick is not a wall."],
["Sustained — the receipt is not sufficient by itself to prove Dana fired the weapon.",false,"That confuses relevance with sufficiency. No single item of evidence has to prove the case."],
["Sustained — buying a gun is a prior act barred by 404(b).",false,"The purchase isn’t offered to show Dana has a bad character. It shows access to the means. Buying a gun lawfully isn’t even a “bad act.”"],
["Overruled — but only if the police later recover the exact weapon.",false,"Nothing in 401 makes relevance depend on recovering the gun. The connection already exists through the matching caliber."]],
a:["Charge: murder. Defense: identity. Contested evidence: the purchase receipt.","401: any tendency + fact of consequence (identity/means). Low bar → relevant.","402: relevant evidence is admissible unless something else excludes it.","403: minimal unfair prejudice. The defense’s real point goes to weight and can be argued to the jury."],
r:["FRE 401","FRE 402"]},

{id:"rel2",t:["rel"],lv:1,title:"The Autopsy Photographs",
facts:"In a murder prosecution, the defense concedes the victim was stabbed to death and argues only misidentification. The prosecution offers eight full-color autopsy photographs. The defense objects under 403.",
q:"What is the correct framework for the ruling?",
o:[["Exclude only if the photos’ probative value is substantially outweighed by the danger of unfair prejudice or needless cumulative evidence. The court may admit some and exclude the rest.",true,"This is the 403 test. The balance favors admission, and the judge can trim duplicates as cumulative. This is the approach in Bocharski."],
["Exclude, because gruesome photographs are inherently unfairly prejudicial.",false,"Evidence isn’t excluded just for being prejudicial. Serge: prejudice “in itself is no vice.” It has to be unfair, and it has to substantially outweigh probative value."],
["Admit all eight automatically, because relevant evidence is always admissible.",false,"402 makes relevant evidence admissible “unless” another rule says otherwise, and 403 is one of those rules."],
["Exclude, because the defense conceded cause of death, so the photos are irrelevant.",false,"The concession lowers the photos’ probative value (a 403 factor), but they still have some tendency to prove elements the prosecution must establish."]],
a:["401: relevant to the manner of death, intent, and corroboration of the medical examiner.","403 dangers: unfair prejudice (inflaming the jury), cumulativeness.","The concession reduces incremental probative value. Weigh that against the inflammatory effect, photo by photo.","The ruling is reviewed for abuse of discretion (“the court may exclude”)."],
r:["FRE 403"],src:"State v. Bocharski; Commonwealth v. Serge"},

{id:"rel3",t:["rel"],lv:2,title:"Flight to California",
facts:"Myers is tried for a Florida bank robbery. The prosecution offers evidence that three weeks after the robbery, Myers ran when FBI agents approached him in California. Myers had an unrelated outstanding warrant at the time.",
q:"What is the defense’s strongest argument?",
o:[["Flight is probative only through a chain of four inferences, and here the chain is weak (the time gap and the separate warrant), so the low probative value is substantially outweighed by unfair prejudice under 403.",true,"Myers runs the chain: conduct → flight → consciousness of guilt → guilt about this crime → actual guilt. The other warrant breaks the third link."],
["Flight is inadmissible character evidence under 404(a).",false,"Flight is offered to show consciousness of guilt, not a character trait. 404(a) doesn’t apply."],
["Running from agents is nonverbal conduct, so it is hearsay.",false,"Myers didn’t intend his running as an assertion, so it isn’t a “statement” under 801(a)."],
["Flight evidence is irrelevant as a matter of law.",false,"Flight can meet the “any tendency” bar. The fight is about how much it proves and about 403."]],
a:["Charge: robbery. Contested evidence: flight.","Four inferences (Myers): (1) behavior → flight; (2) flight → consciousness of guilt; (3) → consciousness of guilt about the crime charged; (4) → actual guilt.","Weak links here: the three-week gap and another reason to run (the warrant).","403: low probative value combined with a risk the jury overweights the flight. Strong ground for exclusion."],
r:["FRE 401","FRE 403"],src:"United States v. Myers"},

{id:"rel4",t:["rel"],lv:2,title:"The Undelivered Threat",
facts:"Kenneth is charged with killing his wife Kristine. The prosecution offers evidence that Kristine planned to tell Kenneth that he was not the father of their son. The theory is that this gave him a motive. The defense says there is no proof Kenneth ever learned of her plan.",
q:"What must the judge find before the jury may hear this evidence?",
o:[["That there is evidence sufficient to support a finding that Kenneth knew of her intention. This is conditional relevance under 104(b).",true,"The evidence is relevant only if a condition (Kenneth’s knowledge) is fulfilled. The judge screens for sufficiency, and the jury decides whether the condition is true."],
["That Kenneth knew, found by the judge by a preponderance under 104(a).",false,"104(a) governs preliminary questions of admissibility like privilege or hearsay exceptions. Conditional relevance goes to the jury under the lower 104(b) standard."],
["Proof beyond a reasonable doubt that Kenneth knew.",false,"No preliminary question uses the criminal standard of proof."],
["Nothing. Motive evidence is always relevant.",false,"Without knowledge, the chain of inference to motive is cut. That is exactly the problem conditional relevance addresses."]],
a:["Conditional relevance: the evidence is probative only if a further fact (knowledge) exists.","104(b): proof must be introduced “sufficient to support a finding” that the condition is fulfilled. The court may admit it conditionally.","Same logic as the Cox problem: new charges supply a motive only if Cox knew about them."],
r:["FRE 104(b)","FRE 401"],src:"Fitzhugh / Cox (course problems)"},

{id:"rel5",t:["rel"],lv:3,title:"The Math Instructor",
facts:"In a robbery case, a witness saw a woman with a blond ponytail and a man with a beard flee in a yellow car. The prosecutor calls a math instructor. He assigns probabilities he admits are “illustrative” (yellow car 1/10, ponytail 1/10, bearded man 1/10, interracial couple 1/1000), multiplies them, and tells the jury there is a 1-in-12-million chance someone other than the defendants did it.",
q:"Best objection?",
o:[["403: the figure rests on guesswork and on treating the traits as independent without any proof, so its probative value is low and the risk of misleading the jury with false precision is high.",true,"Collins: the probabilities were invented and never shown to be independent, and the number invited the jury to swap reasonable doubt for arithmetic."],
["Mathematical evidence is never admissible in a criminal trial.",false,"Your notes say math is fine when it’s based on facts, logically sound, and well explained. The flaw here is the foundation."],
["Hearsay, because the instructor relies on unspecified sources.",false,"The problem isn’t an out-of-court statement. It’s invented inputs and flawed reasoning, which make the number misleading."],
["Irrelevant under 401, because probability can never prove identity.",false,"Probability evidence can have “any tendency” to bear on identity. The fight is over weight and 403."]],
a:["Relevance: in theory, probability bears on identity, so 401 is met.","403: misleading the jury and the aura of mathematical certainty substantially outweigh a figure built on guesses.","Collins reversed: using math is fine; this math was bad."],
r:["FRE 403","FRE 401"],src:"People v. Collins"},

{id:"rel6",t:["rel"],lv:1,title:"Damaging Is Not Unfair",
facts:"In a negligence suit after a crash, the plaintiff offers the defendant’s text sent 30 seconds before impact: “late again lol flooring it.” The defense objects under 403: “This is extremely prejudicial to my client.”",
q:"Ruling?",
o:[["Overruled. “Unfair” prejudice means a tendency to suggest a decision on an improper basis. Evidence that hurts because it is highly probative is not unfair.",true,"403 protects against misuse, such as emotion or improper inference. It does not protect against strong evidence."],
["Sustained, because the text will cause the jury to find against the defendant.",false,"Every piece of good evidence pushes the jury toward a result. That isn’t the danger 403 targets."],
["Sustained under 404 as a prior bad act.",false,"The text is part of the event at issue and is offered for what it shows about the driving, not propensity."],
["Overruled, because 403 does not apply in civil cases.",false,"403 applies in every case."]],
a:["401: speeding just before impact goes directly to breach.","403: probative value is very high; unfair prejudice is minimal. Admit.","The text is also an opposing party’s statement (801(d)(2)(A)) if a hearsay objection is raised."],
r:["FRE 403","FRE 801(d)(2)(A)"]},

{id:"rel7",t:["rel"],lv:2,title:"The New Floor Mats",
facts:"Pat slips on a wet lobby floor at Hotel Corp. A week later, Hotel Corp installs rubber mats. At trial, (1) Pat offers the mats to prove Hotel Corp was negligent. Separately, (2) Hotel Corp’s manager testifies that “mats can’t be used on marble lobbies.”",
q:"How do the two offers come out?",
o:[["(1) Excluded under 407 to prove negligence. (2) Once Hotel Corp disputes feasibility, the mats become admissible to show feasibility (with a limiting instruction).",true,"407 bars subsequent remedial measures to prove negligence or culpable conduct, but allows them for another purpose like feasibility “if disputed.”"],
["Both admissible, because the remedial measure is highly relevant.",false,"407 is a policy exclusion. It keeps out relevant evidence so that defendants aren’t discouraged from fixing hazards."],
["Both excluded, because 407 is absolute.",false,"407 lists other purposes: impeachment, and (if disputed) ownership, control, or feasibility."],
["(1) Admissible because the mats were installed after the accident, not before.",false,"“After” is the trigger for 407. Measures taken before the injury aren’t covered by the rule."]],
a:["407 policy: encourage safety repairs.","Prohibited uses: negligence, culpable conduct, product or design defect, need for a warning.","Allowed uses: impeachment; ownership, control, or feasibility of precautions if disputed.","Use 105 to limit the jury’s use of the evidence."],
r:["FRE 407","FRE 105"]},

{id:"rel8",t:["rel","hs"],lv:3,title:"“I’ll Pay Your Bills”",
facts:"Right after a collision, Drew walks over to Sam and says: “I’ll pay your hospital bills — I was looking at my phone.” Sam sues Drew and offers the whole statement at trial.",
q:"What comes in?",
o:[["“I was looking at my phone” is admissible as an opposing party’s statement. The offer to pay medical bills is excluded under 409.",true,"409 covers only the offer to pay medical expenses. Unlike 408, it doesn’t protect statements that come with the offer. The admission comes in under 801(d)(2)(A)."],
["The whole statement is excluded under 408 as a compromise offer.",false,"There was no disputed claim and no negotiation yet. This is a spontaneous offer to pay medical bills, which falls under 409."],
["The whole statement is excluded under 409.",false,"409 protects the offer, not the factual admission that accompanies it."],
["The whole statement is hearsay with no exception.",false,"Drew is the opposing party, so 801(d)(2)(A) says his statement isn’t hearsay."]],
a:["409: an offer to pay medical expenses is inadmissible to prove liability.","409 vs. 408: 408 also protects statements made during compromise negotiations, but 409 does not protect accompanying statements.","Hearsay: Drew’s own words offered against him → 801(d)(2)(A).","Redact the offer and admit the admission."],
r:["FRE 409","FRE 408","FRE 801(d)(2)(A)"]},

/* ---------- CHARACTER 404–415 ---------- */
{id:"ch1",t:["char"],lv:1,title:"Two Bar Fights",
facts:"Vic is charged with assault after a parking-lot brawl. He claims the other man attacked first. The prosecution offers evidence that Vic was in two unrelated bar fights last year “to show he’s a violent person.”",
q:"Ruling?",
o:[["Excluded. Other acts can’t be used to prove character in order to show action in conformity with it on this occasion.",true,"This is the classic propensity inference that 404(b)(1) prohibits. The prosecutor even said the quiet part out loud."],
["Admitted under 404(b)(2) to show intent.",false,"A permitted purpose has to work without a propensity inference. “He’s violent, so he intended violence” is still propensity."],
["Admitted under 406 as habit.",false,"Two fights aren’t a habit. Habit is a regular, almost automatic response to a specific situation."],
["Admitted, because character evidence is always allowed in criminal cases.",false,"In criminal cases, only the 404(a)(2) exceptions open the door, and Vic hasn’t opened it."]],
a:["Charge: assault. Defense: self-defense.","404(a)(1)/(b)(1): the propensity ban.","No 404(a)(2) door is open, since Vic offered no character evidence.","If Vic later offers the victim’s violent character, the prosecutor may offer evidence of Vic’s violent character under 404(a)(2)(B)(ii)."],
r:["FRE 404(a)(1)","FRE 404(b)(1)"]},

{id:"ch2",t:["char"],lv:1,title:"Michelson’s Character Witness",
facts:"Michelson, charged with bribing a federal agent, calls a witness who testifies that Michelson has a good reputation in the community for honesty and being law-abiding. On cross, the prosecutor asks: “Did you hear that Michelson was arrested in 1927 for receiving stolen goods?”",
q:"Is the question proper?",
o:[["Yes. The defendant opened the door under 404(a)(2)(A), and 405(a) allows cross-examination about relevant specific instances, if the prosecutor has a good-faith basis and the court gives a limiting instruction.",true,"The question tests whether the witness actually knows Michelson’s reputation. Michelson approved “have you heard” questions about arrests."],
["No. Arrests are not convictions, so they cannot be mentioned.",false,"Michelson allowed questions about an arrest because the point is what the community heard, not whether Michelson was guilty."],
["Yes, and the prosecutor may also call the arresting officer to prove the arrest.",false,"405(a) allows inquiry on cross only. The prosecutor must accept the answer and cannot use extrinsic proof."],
["No. 404(b) bars all prior acts.",false,"This isn’t propensity evidence offered by the prosecution. It’s cross-examination of a character witness, which 405(a) permits."]],
a:["Defendant offers a pertinent trait → 404(a)(2)(A).","Method: reputation or opinion on direct (405(a)).","Cross: “have you heard / did you know” about relevant specific instances, with a good-faith basis.","Risk: the jury uses the arrest as propensity evidence → 105 limiting instruction."],
r:["FRE 404(a)(2)(A)","FRE 405(a)","FRE 105"],src:"Michelson v. United States"},

{id:"ch3",t:["char"],lv:1,title:"The Railroad Crossing",
facts:"Harold was killed at a rail crossing with no eyewitnesses. His estate offers testimony from a neighbor that for ten years Harold stopped his truck at that crossing every morning, rolled down his window, and looked both ways before crossing.",
q:"Admissible?",
o:[["Yes, as habit under 406, to show Harold acted in accordance with the habit that morning.",true,"This is a specific, repeated, semi-automatic response to a specific situation. 406 allows it “regardless of whether it is corroborated or whether there was an eyewitness.”"],
["No. It is character evidence showing Harold was careful.",false,"“Careful person” would be character. A particular routine at a particular crossing is habit."],
["Only if an eyewitness corroborates it.",false,"406 expressly drops any corroboration or eyewitness requirement."],
["No. Habit can only be proved for organizations.",false,"406 covers both a person’s habit and an organization’s routine practice."]],
a:["Habit vs. character: specificity, regularity, and a reflexive quality.","406: admissible to prove conduct on a particular occasion.","Still subject to 403."],
r:["FRE 406"]},

{id:"ch4",t:["char"],lv:2,title:"The Purple Zip-Ties",
facts:"Ray is charged with a home-invasion burglary. The homeowners were bound with purple zip-ties, and the burglar left a single jack of spades on the kitchen table. The prosecution offers evidence that Ray committed an earlier burglary using purple zip-ties and leaving a jack of spades. Ray’s defense is that he wasn’t there.",
q:"Best route for the prosecution?",
o:[["404(b)(2) identity (modus operandi), subject to 104(b) proof that Ray committed the earlier act, a 403 balance, a limiting instruction, and 404(b)(3) notice.",true,"The signature is distinctive enough to point to the same person without any reasoning about Ray’s character."],
["404(a)(2)(A), because the defendant’s character is at issue.",false,"Ray hasn’t offered any character evidence. That exception belongs to the defendant."],
["406 habit.",false,"Two burglaries aren’t a semi-automatic routine. Use 404(b)(2) identity."],
["Inadmissible, because other crimes can never be used in criminal cases.",false,"404(b)(2) lists permitted non-propensity purposes. Identity is one of them."]],
a:["Non-propensity chain: same unusual signature → same perpetrator.","Huddleston: the jury must be able to reasonably find, by a preponderance, that Ray did the earlier act (104(b)).","403: weigh probative value against the risk of propensity inference.","Prosecutor must give written notice (404(b)(3)). Court gives a limiting instruction (105)."],
r:["FRE 404(b)(2)","FRE 404(b)(3)","FRE 104(b)","FRE 403"],src:"Huddleston v. United States"},

{id:"ch5",t:["char"],lv:2,title:"A Prior Uncharged Assault",
facts:"Lee is charged with sexual assault. The prosecution offers testimony from a different woman that Lee sexually assaulted her eight years ago. Lee was never charged for that incident.",
q:"Ruling framework?",
o:[["Admissible under 413 for any matter to which it is relevant, including propensity, subject to 403 and the 413 disclosure requirement.",true,"413 is a deliberate exception to the propensity ban in sexual-assault cases. A conviction isn’t required; the rule asks whether the defendant “committed” the other assault."],
["Excluded under 404(b)(1) as propensity.",false,"413 overrides the 404(b) bar in criminal sexual-assault cases."],
["Admissible only if Lee was convicted of the earlier assault.",false,"413 asks whether the defendant “committed” another sexual assault. A conviction isn’t required."],
["Admissible, and 403 cannot be used to exclude it.",false,"Your notes say 413–415 evidence is still subject to 403."]],
a:["413(a): in a criminal sexual-assault case, evidence that the defendant committed any other sexual assault may be considered on any relevant matter.","413(b): disclose to the defendant at least 15 days before trial (or later for good cause).","403 still applies. Consider similarity, time gap, frequency, and how reliable the proof is.","Civil counterpart: 415. Child molestation: 414."],
r:["FRE 413","FRE 403"]},

{id:"ch6",t:["char"],lv:2,title:"Who Started It?",
facts:"In a homicide prosecution, Tony claims self-defense. He calls a witness who testifies that the deceased had a reputation for violence. In rebuttal, the prosecutor offers a witness who will testify that Tony has a reputation for violence.",
q:"Is the prosecutor’s rebuttal witness proper?",
o:[["Yes. Once the defendant offers the victim’s pertinent trait, the prosecutor may offer evidence of the defendant’s same trait under 404(a)(2)(B)(ii).",true,"Attacking the victim’s character opens the door to the same trait in the defendant."],
["No. The prosecutor may only rebut with the victim’s peaceful character.",false,"Rebutting the victim’s trait is one option, (B)(i). (B)(ii) also allows the same trait of the defendant."],
["No. Only the defendant’s own character witness can open the door to his character.",false,"404(a)(2)(B)(ii) specifically opens the defendant’s same trait when he attacks the victim’s character."],
["Yes, under 404(a)(2)(C) only.",false,"(C) lets the prosecutor offer the victim’s peacefulness in a homicide case when the defense claims the victim was the first aggressor. It doesn’t cover the defendant’s violence."]],
a:["Defendant offers the victim’s trait → 404(a)(2)(B). (In sex-offense cases, 412 limits this.)","Prosecutor may (i) rebut the victim’s trait and (ii) offer the defendant’s same trait.","Homicide + first-aggressor claim → (C): victim’s peacefulness, even without character evidence from the defense.","Method: reputation or opinion (405(a))."],
r:["FRE 404(a)(2)(B)","FRE 404(a)(2)(C)","FRE 405(a)"]},

{id:"ch7",t:["char"],lv:1,title:"The Returned Wallet",
facts:"In a theft trial, the defendant’s character witness testifies on direct: “Let me tell you, last year he found a wallet with $500 in it and returned every cent.”",
q:"Proper?",
o:[["No. On direct, character must be proved by reputation or opinion. Specific instances are allowed only on cross (or when character is an essential element).",true,"405(a) limits the method. The trait is pertinent (honesty in a theft case), but the form is wrong."],
["Yes. Specific instances are the most reliable proof of character.",false,"That may be true in life, but 405(a) prefers reputation and opinion to avoid side trials over specific events."],
["No. Honesty isn’t pertinent to theft.",false,"Honesty is plainly pertinent to a theft charge. The problem is the method."],
["Yes, under 406 habit.",false,"One good deed isn’t a habit."]],
a:["Door: 404(a)(2)(A), the defendant’s pertinent trait.","Method: 405(a) reputation or opinion on direct.","405(b) allows specific instances only when character is an essential element of a charge, claim, or defense."],
r:["FRE 405(a)","FRE 405(b)"],src:"Problem 3.17"},

{id:"ch8",t:["char"],lv:3,title:"Negligent Entrustment",
facts:"A trucking company is sued for negligent entrustment. The claim is that it let a driver with a known history of reckless driving operate its rig. The plaintiff offers evidence of the driver’s three prior reckless-driving incidents.",
q:"Admissible?",
o:[["Yes. The driver’s character for recklessness (and the company’s knowledge of it) is an essential element of the claim, so specific instances are allowed under 405(b).",true,"The evidence isn’t offered to show the driver acted recklessly on this occasion. The claim itself turns on his character and the company’s knowledge."],
["No. 404(a)(1) bars character evidence in civil cases.",false,"404(a)(1) bars the propensity inference. When character is itself an element, there is no propensity inference."],
["Only reputation or opinion is permitted.",false,"405(b) allows specific instances when character is an essential element."],
["Admissible only to impeach the driver.",false,"It’s offered substantively, to prove an element."]],
a:["Character “in issue” → no propensity inference → 404 doesn’t bar it.","405(b): specific instances allowed.","403 still applies, and a 105 instruction can limit its use against the driver on the separate negligence claim."],
r:["FRE 405(b)","FRE 404(a)(1)"]},

{id:"ch9",t:["char"],lv:3,title:"Another Source of Injury",
facts:"In a sexual-assault prosecution, the defense wants to show that the complainant’s bruising came from consensual intercourse with her boyfriend earlier that evening, not from the defendant.",
q:"Governing rule and result?",
o:[["412(b)(1)(A) allows specific instances of the victim’s sexual behavior to prove that someone other than the defendant was the source of injury, after a 412(c) motion and an in-camera hearing.",true,"412 generally bars this evidence (the rape shield). Alternative source of semen, injury, or other physical evidence is a listed exception in criminal cases."],
["Admissible under 404(a)(2)(B) as the victim’s pertinent trait.",false,"404(a)(2)(B) is expressly “subject to the limitations in Rule 412.” 412 controls here."],
["Always excluded under the rape shield.",false,"412(b)(1) lists criminal-case exceptions, including alternative source and consent with the defendant, plus evidence the Constitution requires."],
["Admissible without notice because it is exculpatory.",false,"412(c) requires a written motion at least 14 days before trial, notice to the victim, and a sealed in-camera hearing."]],
a:["412(a): bars evidence of the victim’s other sexual behavior or predisposition.","Criminal exceptions, 412(b)(1): (A) other source of semen, injury, or physical evidence; (B) behavior with the defendant, to prove consent; (C) constitutionally required.","Procedure, 412(c): motion 14 days before trial, notice to the victim, sealed in-camera hearing."],
r:["FRE 412"]},

/* ---------- IMPEACHMENT 607–613 ---------- */
{id:"im1",t:["imp"],lv:1,title:"The Perjury Misdemeanor",
facts:"In a contract case, a key witness for the defendant was convicted six years ago of misdemeanor false swearing, which was punishable by up to 6 months. The plaintiff wants to impeach her with the conviction.",
q:"Ruling?",
o:[["Must be admitted under 609(a)(2). Its elements required proving a false statement, so no balancing is allowed and the punishment level doesn’t matter.",true,"609(a)(2) convictions “must be admitted” regardless of punishment when the court can readily determine a dishonest act or false statement was an element."],
["Excluded, because misdemeanors cannot be used to impeach.",false,"Misdemeanors are excluded only under (a)(1). Crimen falsi crimes come in under (a)(2) whatever the punishment."],
["Admitted only if it survives 403.",false,"Balancing applies to (a)(1) convictions. (a)(2) is automatic."],
["Governed by 608(b), so no extrinsic evidence is allowed.",false,"608(b) expressly excludes criminal convictions, which are governed by 609."]],
a:["Under 10 years old → 609(a), not (b).","Dishonest act or false statement as an element → (a)(2): mandatory admission.","Proof by the record of conviction or by cross-examination is fine."],
r:["FRE 609(a)(2)"]},

{id:"im2",t:["imp"],lv:2,title:"The Defendant’s Drug Conviction",
facts:"Marcus is on trial for distributing heroin. Four years ago he was convicted of felony heroin distribution and served 18 months. He plans to testify that he was only a bystander. The prosecutor moves to impeach him with the prior conviction.",
q:"Which test applies, and which way does it likely cut?",
o:[["609(a)(1)(B): admit only if probative value outweighs the prejudicial effect to the defendant. The near-identical prior crime strongly suggests exclusion.",true,"For a testifying defendant the balance protects him. The factors are impeachment value (drug crimes are low), remoteness, similarity (high, which is bad for admission), and the importance of his testimony."],
["403: admit unless substantially outweighed by unfair prejudice.",false,"403 governs (a)(1) convictions of witnesses other than a criminal defendant."],
["Automatically admitted under 609(a)(2).",false,"Drug distribution doesn’t require proof of a dishonest act or false statement."],
["Excluded under 609(b) as too old.",false,"Four years since conviction (and less since release) is well within ten years."]],
a:["Felony (>1 year) + witness is the accused → 609(a)(1)(B).","Factors: impeachment value of the crime, its timing, similarity to the charged crime, importance of the defendant’s testimony, centrality of credibility.","Similarity creates a serious risk of propensity use → exclusion is likely. Argue both sides on the exam."],
r:["FRE 609(a)(1)(B)"]},

{id:"im3",t:["imp"],lv:2,title:"Thirteen Years Later",
facts:"Trial is in 2026. A prosecution witness was convicted of armed robbery in 2011 and released from prison in 2013. The defense wants to impeach him with it and gives no advance notice.",
q:"Ruling?",
o:[["Governed by 609(b). More than 10 years have passed since release, so the conviction comes in only if its probative value, supported by specific facts and circumstances, substantially outweighs its prejudicial effect, and only with reasonable written notice. Without notice it’s excluded.",true,"Count from the later of conviction or release (2013). 13 > 10. (b) reverses the presumption and requires notice."],
["609(a)(1)(A): admit subject to 403.",false,"You have to check the 10-year clock first."],
["Admissible because it is a felony.",false,"The felony status matters only after you clear the 609(b) timing question."],
["609(a)(2) applies because robbery is a crime of dishonesty.",false,"Robbery’s elements don’t require a false statement or deceit."]],
a:["Clock: the later of conviction or release (2013) → 13 years.","609(b)(1): probative value substantially outweighs prejudicial effect, supported by specific facts.","609(b)(2): reasonable written notice."],
r:["FRE 609(b)"]},

{id:"im4",t:["imp"],lv:2,title:"The Padded Résumé",
facts:"On cross, a plaintiff’s witness is asked: “Isn’t it true you claimed a college degree on your job application that you never earned?” She says “No.” The defense then offers the application and calls the HR director to prove the lie.",
q:"Ruling on the application and the HR director?",
o:[["Both excluded. 608(b) allows the question on cross, but extrinsic evidence may not be used to prove the specific instance. The examiner is stuck with the answer.",true,"Lying on an application is probative of untruthfulness, so the question was proper. The extrinsic proof is not."],
["Both admitted, because the witness lied on the stand.",false,"The rule exists to prevent mini-trials on collateral matters affecting credibility."],
["Admitted under 609, since lying is a crime.",false,"There is no conviction, so 609 doesn’t apply."],
["The question itself was improper.",false,"Courts may allow inquiry into specific instances that are probative of truthfulness."]],
a:["608(b): no extrinsic evidence to prove specific instances (except convictions under 609).","Cross allowed if probative of the witness’s character for truthfulness or untruthfulness, with a good-faith basis.","Extrinsic proof is allowed for bias or contradiction on a non-collateral matter, which is a different theory."],
r:["FRE 608(b)"]},

{id:"im5",t:["imp"],lv:1,title:"Premature Bolstering",
facts:"Before the witness is cross-examined at all, the plaintiff calls the witness’s pastor to testify that the witness “has an excellent reputation for truthfulness.”",
q:"Ruling?",
o:[["Excluded. Evidence of truthful character is admissible only after the witness’s character for truthfulness has been attacked.",true,"608(a): no bolstering before an attack."],
["Admitted. Reputation is the proper method under 608(a).",false,"The method is right, but the timing is wrong."],
["Admitted under 404(a)(2)(A).",false,"That exception covers a criminal defendant’s pertinent trait, not a witness’s credibility."],
["Excluded, because pastors are incompetent witnesses under 610.",false,"610 bars using religious beliefs to attack or support credibility. It doesn’t disqualify clergy as witnesses."]],
a:["608(a): reputation or opinion for truthfulness or untruthfulness.","Support is allowed only after an attack.","Does an attack for bias count as an attack on character? Courts vary. Argue both sides."],
r:["FRE 608(a)"]},

{id:"im6",t:["imp","hs"],lv:2,title:"Red Light, Green Light",
facts:"At the scene, a bystander told an officer, informally and not under oath, “The van ran the red.” At trial, called by the plaintiff, the bystander testifies the light was green for the van. The plaintiff offers the officer’s testimony about the earlier statement.",
q:"How may the jury use the earlier statement?",
o:[["Only to impeach (with a limiting instruction). It wasn’t made under penalty of perjury at a proceeding or deposition, so 801(d)(1)(A) doesn’t make it substantive.",true,"Prior inconsistent statements can always impeach. They are substantive only if made under penalty of perjury at a trial, hearing, other proceeding, or deposition."],
["As substantive evidence under 801(d)(1)(A), because the bystander now testifies.",false,"Testifying is necessary but not enough. The prior statement also had to be made under oath at a proceeding."],
["As substantive evidence under 801(d)(2), because it was offered against the opposing party.",false,"The bystander isn’t a party, so 801(d)(2) doesn’t apply."],
["Not at all, because a party may not impeach its own witness.",false,"607 allows any party, including the one that called the witness, to attack the witness’s credibility."]],
a:["607: may impeach your own witness. (Watch for Ince subterfuge.)","613(b): extrinsic evidence only after the witness has had a chance to explain or deny it.","Substantive use requires 801(d)(1)(A): an oath plus a formal proceeding (grand jury testimony qualifies).","105: limiting instruction."],
r:["FRE 607","FRE 613(b)","FRE 801(d)(1)(A)","FRE 105"]},

{id:"im7",t:["imp","hs"],lv:3,title:"Tome’s Timing Problem",
facts:"Jordan testifies for the prosecution. On cross, the defense suggests he made up his story after he struck a cooperation deal in March. In rebuttal, the prosecution offers (1) Jordan’s consistent statement to a friend in January and (2) a consistent statement to agents in April.",
q:"Which statement is admissible substantively?",
o:[["Only the January statement. Under 801(d)(1)(B)(i) and Tome, a consistent statement rebuts a charge of recent fabrication only if it came before the alleged motive arose.",true,"A statement made after the March deal shares the same motive, so it doesn’t rebut the charge."],
["Both, because both are consistent with his testimony.",false,"Consistency alone isn’t enough. Tome requires that the statement predate the motive."],
["Neither. Prior consistent statements are always hearsay.",false,"801(d)(1)(B) defines them as not hearsay when the conditions are met."],
["Only the April statement, because it was made to law enforcement.",false,"Who heard the statement doesn’t matter. When it was made does."]],
a:["Declarant testifies and is subject to cross.","(B)(i): rebut a charge of recent fabrication or improper motive → Tome’s pre-motive rule.","(B)(ii): rehabilitate when credibility is attacked on another ground (for example, a faulty memory)."],
r:["FRE 801(d)(1)(B)"],src:"Tome v. United States"},

{id:"im8",t:["imp","hs"],lv:3,title:"Calling a Witness to Impeach Her",
facts:"The prosecution knows that Neumann, if called, will deny hearing the defendant confess. It calls her anyway. When she denies it, the prosecution calls an agent to testify that Neumann earlier told him (unsworn) that she heard the defendant confess.",
q:"Best objection?",
o:[["Ince: 607 can’t be used as a subterfuge to put otherwise inadmissible hearsay before the jury. The primary purpose was to get the unsworn statement in, so it fails 403.",true,"The impeachment has almost no value (the prosecution knew she’d deny) and the risk of substantive misuse is huge. Ince reversed."],
["A party can never impeach its own witness.",false,"607 abolished the voucher rule. The problem is the misuse."],
["It’s a proper 801(d)(1)(A) statement.",false,"It wasn’t made under penalty of perjury at a proceeding."],
["613(b) bars it because she wasn’t shown the statement first.",false,"613(a) doesn’t require showing the statement to the witness, and she had a chance to deny it. The real problem is the Ince misuse plus 403."]],
a:["607 + 403 combined: no impeachment as a mere subterfuge.","The jury can’t realistically follow a limiting instruction here.","Contrast: a surprise turncoat witness may be impeached."],
r:["FRE 607","FRE 403","FRE 801(d)(1)(A)"],src:"United States v. Ince"},

{id:"im9",t:["imp","hs"],lv:3,title:"Impeaching a Missing Declarant",
facts:"A bystander’s excited utterance identifying the defendant is admitted under 803(2). The bystander never testifies. The defense offers the bystander’s 2022 felony fraud conviction and evidence that the bystander told someone else the robber was “a tall bald guy.” The defendant has a full head of hair.",
q:"Admissible?",
o:[["Yes. 806 lets the defense attack a hearsay declarant’s credibility as if the declarant had testified, and the declarant doesn’t need an opportunity to explain or deny the inconsistent statement.",true,"806 treats the declarant like a witness and waives the 613(b)-style foundation for inconsistent statements."],
["No. Only witnesses who testify can be impeached.",false,"806 extends impeachment to declarants whose statements are admitted under 801(d)(2)(C)–(E) or a hearsay exception."],
["The conviction is admissible, but the inconsistent statement is excluded under 613(b).",false,"806 says evidence of the declarant’s inconsistent statement is admissible “regardless of when it occurred or whether the declarant had an opportunity to explain or deny it.”"],
["Only reputation evidence is allowed.",false,"Any impeachment that would be allowed if the declarant testified is available, including 609 convictions."]],
a:["806 applies to hearsay statements and to 801(d)(2)(C), (D), and (E) statements.","Convictions → 609 analysis (fraud is (a)(2), so it must be admitted).","Inconsistent statement → no 613(b) foundation is required."],
r:["FRE 806","FRE 609(a)(2)","FRE 803(2)"]},

{id:"im10",t:["imp"],lv:1,title:"The Cousin Who Owes Money",
facts:"A defense alibi witness is the defendant’s cousin and owes him $8,000. The prosecutor asks about both facts on cross. When the witness denies the debt, the prosecutor offers the signed promissory note.",
q:"Ruling?",
o:[["Admissible. Bias is always relevant to credibility and may be proved by extrinsic evidence after a foundation on cross.",true,"Bias isn’t character evidence, so 608(b)’s extrinsic-evidence ban doesn’t apply. (Abel.)"],
["Excluded under 608(b), because extrinsic evidence is barred.",false,"608(b) covers specific acts offered to show character for truthfulness. Bias is a different theory."],
["Excluded, because family relationships are private.",false,"Relationship and money are classic sources of bias."],
["Admissible only under 609.",false,"There’s no conviction."]],
a:["Ways to attack: credibility (character), bias, motive, capacity, contradiction.","Bias → extrinsic evidence OK; give the witness a chance to admit it first.","403 still limits it."],
r:["FRE 607","FRE 611(a)","FRE 403"],src:"United States v. Abel"},

/* ---------- PRIVILEGES 501–502 ---------- */
{id:"pr1",t:["priv"],lv:1,title:"The Internal Investigation",
facts:"General counsel for a corporation interviews mid-level sales managers about suspected foreign bribes so she can advise the company. The managers know the purpose and are told to keep the interviews confidential. The IRS subpoenas her interview notes.",
q:"Are the notes privileged?",
o:[["Yes. Under Upjohn, communications from employees at any level made at counsel’s direction to secure legal advice for the corporation are privileged. (The underlying facts aren’t.)",true,"Upjohn rejected the “control group” test. The IRS can still depose the employees about the facts."],
["No. Only the control group (senior executives) can make privileged communications.",false,"That’s the test Upjohn rejected under 501’s federal common law."],
["No. Corporations have no attorney-client privilege.",false,"They do, and the privilege belongs to the entity."],
["Yes, and the employees can refuse to testify about the underlying facts too.",false,"Privilege protects communications, not facts."]],
a:["501: federal common law “in the light of reason and experience.”","Elements: (1) communication (2) in confidence (3) between client and counsel (4) for legal advice.","Upjohn: the subject-matter and need-to-know approach covers corporate employees.","Work product may also protect the notes."],
r:["FRE 501"],src:"Upjohn Co. v. United States"},

{id:"pr2",t:["priv"],lv:2,title:"The Accidental Production",
facts:"In a federal lawsuit, a firm produces 60,000 documents after running a privilege-review protocol. One privileged memo slips through. When the firm learns of it the next week, it promptly demands the memo back under the protective order’s clawback procedure.",
q:"Has the privilege been waived?",
o:[["No. Under 502(b), the disclosure was inadvertent, the holder took reasonable steps to prevent it, and the holder promptly took reasonable steps to fix the error.",true,"All three 502(b) elements are met."],
["Yes. Any disclosure waives the privilege.",false,"502(b) was adopted to reject that strict approach for inadvertent disclosures."],
["Yes, and the waiver extends to all documents on the same subject.",false,"Subject-matter waiver (502(a)) requires an intentional waiver, the same subject, and fairness. None of that is present here."],
["No, but only because the memo was marked “confidential.”",false,"Labels help but aren’t the test. 502(b)’s three elements are."]],
a:["502(b): inadvertent + reasonable steps to prevent + prompt steps to rectify → no waiver.","502(a): an intentional disclosure extends to undisclosed material only if it concerns the same subject and fairness requires it.","502(d): a court order can protect against waiver in other proceedings."],
r:["FRE 502(b)","FRE 502(a)"]},

{id:"pr3",t:["priv"],lv:2,title:"Structuring Advice",
facts:"A client asks his lawyer how to split $95,000 in cash into deposits under $10,000 so the bank won’t file currency reports. The lawyer explains how reporting thresholds work. A grand jury later subpoenas the lawyer.",
q:"Privileged?",
o:[["No. The crime-fraud exception applies because the client sought advice to further a future crime (structuring).",true,"The privilege doesn’t protect communications made to plan a future crime or fraud, whether or not the lawyer knew."],
["Yes. All lawyer-client communications are privileged.",false,"The crime-fraud exception is well established in federal common law."],
["Yes, because the lawyer didn’t know the client’s purpose.",false,"The client’s intent controls."],
["No, because the conversation involved money.",false,"Financial topics aren’t the issue. The purpose of furthering a crime is."]],
a:["Elements of the privilege are present, but the exception defeats it.","The client’s purpose to commit a future crime or fraud is what matters.","Advice about past crimes remains privileged."],
r:["FRE 501"],src:"United States v. Zolin"},

{id:"pr4",t:["priv"],lv:1,title:"The Willing Wife",
facts:"Otis is on trial for drug distribution. His wife is willing to testify for the prosecution about drug transactions she saw at their home. Otis claims the spousal privilege to stop her.",
q:"Can Otis block the testimony?",
o:[["No. Under Trammel, the witness-spouse alone holds the adverse spousal testimony privilege, and she has chosen to testify.",true,"Trammel moved the privilege to the witness-spouse. Her observations aren’t confidential communications either."],
["Yes. Either spouse can block adverse spousal testimony.",false,"That was the Hawkins rule, which Trammel abandoned."],
["Yes, under the marital communications privilege.",false,"That privilege covers confidential communications between spouses. Watching transactions isn’t a communication."],
["No, because privileges don’t apply in criminal cases.",false,"Privileges apply at every stage of every proceeding (1101(c))."]],
a:["Two marital privileges: (1) adverse spousal testimony, held by the witness-spouse (Trammel); (2) confidential marital communications, which either spouse can usually invoke.","Observations ≠ communications.","Remember: in Crawford, the wife’s invocation of privilege is what made her unavailable."],
r:["FRE 501"],src:"Trammel v. United States"},

{id:"pr5",t:["priv"],lv:3,title:"The Diversity Accountant",
facts:"A state-law breach-of-contract case is in federal court on diversity jurisdiction. The plaintiff subpoenas the defendant’s accountant. State law recognizes an accountant-client privilege. Federal common law does not.",
q:"Which privilege law governs?",
o:[["State law. 501 says that in a civil case, state law governs privilege for a claim or defense where state law supplies the rule of decision.",true,"A pure state-law claim → state privilege law."],
["Federal common law, because the case is in federal court.",false,"501’s second sentence carves out state-law claims in civil cases."],
["Whichever law gives broader protection.",false,"501 picks a law based on which law supplies the rule of decision, not on which protects more."],
["The court must certify the question to the state supreme court.",false,"501 answers the question directly."]],
a:["501: federal common law generally applies.","Exception: civil cases where state law supplies the rule of decision on the claim or defense.","Mixed federal and state claims → courts usually apply federal privilege law."],
r:["FRE 501"]},

/* ---------- HEARSAY 801–807 ---------- */
{id:"hs1",t:["hs"],lv:1,title:"“I Accept”",
facts:"In a contract dispute, the plaintiff testifies that the defendant called her and said, “I accept your offer at $40,000.”",
q:"Hearsay?",
o:[["Not hearsay. The words are a verbal act, legally operative language that forms the contract. They aren’t offered for the truth of any assertion. (They would also be an opposing party’s statement.)",true,"Contract formation turns on the words being spoken, not on whether they are true."],
["Hearsay, but admissible under 803(1).",false,"There’s nothing to except, because no truth-of-the-matter use is involved."],
["Hearsay with no exception.",false,"Operative words aren’t offered for their truth."],
["Not hearsay, but excluded under 403 as unfairly prejudicial.",false,"The words are the heart of the contract claim. Highly probative evidence isn’t unfairly prejudicial."]],
a:["Ask “Offered for what?” before anything else.","Verbal acts (offer, acceptance, defamatory words, threats as elements) → not hearsay.","Backup: 801(d)(2)(A)."],
r:["FRE 801(c)","FRE 801(d)(2)(A)"]},

{id:"hs2",t:["hs"],lv:1,title:"Notice of the Spill",
facts:"In a slip-and-fall case against a grocery store, the plaintiff calls a shopper who will testify that 20 minutes before the fall she told the store manager, “There’s oil all over aisle 5.” The plaintiff offers it to show the store had notice.",
q:"Hearsay?",
o:[["Not hearsay. It’s offered for its effect on the listener (notice), not to prove oil was there. A limiting instruction is available.",true,"Whether or not the statement was true, hearing it put the manager on notice."],
["Hearsay, because it is an out-of-court statement.",false,"An out-of-court statement is hearsay only if it is offered for its truth."],
["Hearsay, but admissible under 803(2).",false,"If it were offered for its truth, you would look at 803(1) or (2). Here it isn’t."],
["Not hearsay, because the shopper is testifying in court.",false,"She is in court, but she made the statement out of court. The non-truth purpose is what saves it."]],
a:["Non-truth purposes: notice, effect on the listener, verbal acts, impeachment, circumstantial evidence of state of mind.","105: limit the jury to the notice purpose.","If the plaintiff also needs to prove the oil existed, use the shopper’s firsthand testimony."],
r:["FRE 801(c)","FRE 105"]},

{id:"hs3",t:["hs"],lv:1,title:"The Seaworthy Ship",
facts:"To prove a ship was seaworthy, its owner offers evidence that the experienced captain, after inspecting every part of it, sailed away on it with his family aboard. (The captain is now dead.)",
q:"Hearsay under the FRE?",
o:[["Not hearsay. The captain’s conduct wasn’t intended as an assertion, so it isn’t a “statement” under 801(a).",true,"At common law (Wright v. Tatham) implied assertions were treated as hearsay. The FRE drops that view: nonassertive conduct isn’t a statement."],
["Hearsay, because it implies the captain believed the ship was safe.",false,"That was the common-law approach, which the FRE rejected."],
["Hearsay, but admissible as a dying declaration.",false,"No statement and no belief in imminent death."],
["Not hearsay, because the captain is dead.",false,"Unavailability matters only for 804 exceptions. The real reason is that there was no assertion."]],
a:["801(a): conduct is a statement only if the person intended it as an assertion.","The captain had no audience and no intent to communicate, which goes to sincerity.","The hearsay dangers (perception, memory, narration, sincerity) are reduced when there is no intent to assert."],
r:["FRE 801(a)"],src:"Wright v. Tatham (sea captain)"},

{id:"hs4",t:["hs"],lv:1,title:"Your Own Words",
facts:"In a negligence trial, the defendant driver wants to introduce his own statement to a police officer at the scene: “I was going the speed limit and the other car came out of nowhere.”",
q:"Can the defendant offer this?",
o:[["No. A party’s statement is not hearsay only when it is offered against that party. Offered by the defendant himself, it is hearsay, and no exception fits.",true,"801(d)(2) requires that the statement be “offered against an opposing party.”"],
["Yes, under 801(d)(2)(A).",false,"You can’t admit your own self-serving statement through 801(d)(2)."],
["Yes, as a present sense impression.",false,"He made it after the event as an account of what happened, not while perceiving it or immediately after."],
["Yes, because the defendant is available to testify.",false,"Being available doesn’t make an out-of-court statement admissible. He can simply testify."]],
a:["801(d)(2) works in one direction: against the party who made the statement.","The plaintiff could offer it (it doesn’t need to be against interest when made).","The defendant’s remedy is to testify live."],
r:["FRE 801(d)(2)(A)","FRE 802"]},

{id:"hs5",t:["hs"],lv:1,title:"The 911 Description (Civil)",
facts:"In a civil wrongful-death suit, the plaintiff offers a 911 recording. The caller, an unidentified motorist, says while driving: “The red pickup in front of me is swerving across both lanes right now — he just clipped a mailbox!”",
q:"Best hearsay route?",
o:[["803(1) present sense impression. It describes an event while the declarant was perceiving it. (803(2) also fits because a swerving truck is startling.)",true,"Made at the same time as the event, which reduces memory and sincerity concerns."],
["803(3) then-existing state of mind.",false,"The statement describes outside events, not the caller’s own mental state."],
["804(b)(2) dying declaration.",false,"The caller wasn’t dying, and it’s unclear whether the caller is even unavailable."],
["Not admissible because the caller is unidentified.",false,"803 exceptions apply “regardless of whether the declarant is available,” and anonymity goes to weight. Personal knowledge can be inferred from the call itself."]],
a:["803(1): describing or explaining an event, while or immediately after perceiving it.","803(2): relating to a startling event, under the stress of excitement.","Civil case → no Confrontation analysis."],
r:["FRE 803(1)","FRE 803(2)"]},

{id:"hs6",t:["hs","conf"],lv:2,title:"“I’m Going to Meet Dan”",
facts:"Rita is found dead. The prosecution offers her friend’s testimony that on the afternoon Rita disappeared, Rita said: “I’m going to meet Dan at the boathouse tonight.” Dan is on trial.",
q:"Best route, and is there a Confrontation problem?",
o:[["803(3): a statement of the declarant’s then-existing intent (plan) is admissible to show she acted on it (Hillmon). Using it to prove Dan’s conduct is debated and may call for a limiting instruction. It’s a casual remark to a friend, so it’s nontestimonial and raises no Confrontation problem.",true,"Forward-looking intent fits 803(3). The Confrontation analysis turns on the statement being nontestimonial."],
["Excluded, because 803(3) bars statements of memory or belief.",false,"That limit covers backward-looking statements (“Dan poisoned me”). Rita stated a future plan."],
["804(b)(2) dying declaration.",false,"Rita didn’t believe her death was imminent."],
["Barred by the Confrontation Clause, because Rita can’t be cross-examined.",false,"Crawford applies only to testimonial statements. A remark to a friend isn’t made for later prosecution."]],
a:["Hearsay: offered for its truth (her intent), so it needs an exception.","803(3) → Hillmon doctrine; courts split on using it to prove a third party’s conduct.","Confrontation: criminal case → declarant doesn’t testify → nontestimonial → the Clause isn’t triggered.","403 and a 105 instruction."],
r:["FRE 803(3)","Sixth Amendment"],src:"Mutual Life v. Hillmon"},

{id:"hs7",t:["hs"],lv:2,title:"“Dr. Shepard Has Poisoned Me”",
facts:"Mrs. Shepard fell ill. Days later she told her nurse, “Dr. Shepard has poisoned me,” and asked her to test a liquor bottle. She was improving at the time and talked about recovering. She died soon after. At Dr. Shepard’s murder trial the prosecution offers the statement as a dying declaration, and in the alternative under 803(3).",
q:"Ruling?",
o:[["Excluded. It isn’t a dying declaration because there was no settled, hopeless expectation of imminent death. 803(3) doesn’t cover a statement of memory or belief offered to prove the fact believed.",true,"Shepard (Cardozo, J.): you can’t use state of mind to prove a past act by the person she accuses."],
["Admissible as a dying declaration, because she later died.",false,"What matters is her belief when she spoke, and she was talking about recovery."],
["Admissible under 803(3) to show her state of mind.",false,"Offered to prove Dr. Shepard poisoned her, it is a belief about a past fact, which 803(3) expressly excludes."],
["Admissible under 803(4) because it was made to a nurse.",false,"Assigning blame to a specific person isn’t pertinent to treatment, and the statement asked for a test, not treatment."]],
a:["804(b)(2): homicide or civil case + belief that death is imminent + about its cause or circumstances.","803(3) excludes “a statement of memory or belief to prove the fact remembered or believed.”","Even when a state of mind is relevant (for example, rebutting suicide), the risk of the jury misusing it can call for exclusion under 403."],
r:["FRE 804(b)(2)","FRE 803(3)"],src:"Shepard v. United States"},

{id:"hs8",t:["hs"],lv:2,title:"The ER Visit",
facts:"In a civil battery suit, the plaintiff offers ER records quoting what she told the doctor: “I was hit on the head with a baseball bat. The guy who did it was my landlord, Earl.”",
q:"Which part comes in under 803(4)?",
o:[["“Hit on the head with a baseball bat” comes in. It describes the general cause and is pertinent to treatment. Identifying Earl usually isn’t pertinent and should be redacted (except in some domestic or child-abuse cases).",true,"803(4) covers medical history, symptoms, inception, and “their general cause.” Fault is generally outside the exception."],
["The whole statement, because it was made to a doctor.",false,"Each part of the statement must be reasonably pertinent to diagnosis or treatment."],
["Neither part, because the plaintiff is available to testify.",false,"803 exceptions apply regardless of availability."],
["Neither part, because medical records are only business records.",false,"The record is a layer (803(6)). The patient’s statement inside it needs 803(4). That’s hearsay within hearsay (805)."]],
a:["Two layers: the ER record (803(6)) + the patient’s statement (803(4)) → 805.","Cause vs. fault: cause is in, fault generally is out.","Some courts admit the abuser’s identity in domestic-violence cases because it bears on safety planning."],
r:["FRE 803(4)","FRE 803(6)","FRE 805"]},

{id:"hs9",t:["hs"],lv:3,title:"The Officer’s Accident Report",
facts:"In a civil suit over an intersection crash, the plaintiff offers the investigating officer’s report. It contains (1) the officer’s own measurements of skid marks and (2) a passing pedestrian’s statement to the officer: “The blue car ran the red light.”",
q:"Ruling?",
o:[["(1) Admissible as a public record of matters observed under a legal duty, or as a business record. (2) Needs its own exception, because the pedestrian had no duty to report (Johnson v. Lutz). That’s hearsay within hearsay (805).",true,"The report’s reliability rests on everyone in the chain acting under a duty. A volunteer bystander breaks the chain."],
["Admissible in full under 803(6).",false,"803(6) covers the record keeper’s layer, not outsiders’ statements recorded in it."],
["Excluded in full under 803(8), because law-enforcement reports are barred.",false,"The law-enforcement limit in 803(8)(A)(ii) applies only in criminal cases."],
["Admissible in full under 803(8)(A)(iii) as factual findings.",false,"Findings are the officer’s conclusions. The bystander’s quoted words are still a separate layer of hearsay."]],
a:["Layer 1: report → 803(8)(A)(ii) (civil) or 803(6).","Layer 2: pedestrian’s statement → look for 803(1) or (2). If it doesn’t fit, redact.","805: each layer must satisfy an exception.","803(8) bars matters observed by law enforcement in criminal cases. Your notes flag business records as an exam topic."],
r:["FRE 803(6)","FRE 803(8)","FRE 805"],src:"Johnson v. Lutz"},

{id:"hs10",t:["hs"],lv:1,title:"Bank Statements",
facts:"In a fraud case brought by a private plaintiff, the plaintiff offers a bank’s monthly account statements. The bank’s records custodian testifies about how the statements are prepared and kept.",
q:"Admissible?",
o:[["Yes. Business records under 803(6): made at or near the time by someone with knowledge, kept in the regular course, as a regular practice, with the custodian laying the foundation.",true,"803(6)(D): the custodian or another qualified witness testifies to the conditions. The custodian needn’t have made the records personally."],
["No. The employees who entered each transaction must testify.",false,"803(6)(D) lets the custodian or another qualified witness lay the foundation. The makers need not testify."],
["Yes, under 803(8) as public records.",false,"Banks aren’t public offices."],
["No, because computer records are inherently untrustworthy.",false,"The opponent bears the burden of showing untrustworthiness (803(6)(E))."]],
a:["803(6) (A)–(E): timing, knowledge, regular course, regular practice, foundation; the opponent can show lack of trustworthiness.","The foundation witness needs familiarity with the record-keeping system, not personal knowledge of each entry.","Your notes list business records as a final exam topic."],
r:["FRE 803(6)"]},

{id:"hs11",t:["hs"],lv:2,title:"Proving the Battery with the Conviction",
facts:"Sam sues Jake for battery. Jake was previously convicted after a jury trial of felony aggravated battery (punishable by up to 5 years) for the same punch. Sam offers the judgment of conviction to prove Jake struck him.",
q:"Admissible?",
o:[["Yes, under 803(22). It is a final judgment after a trial, for a crime punishable by more than one year, offered to prove a fact essential to the judgment.",true,"Note: your outline lists this as 803(23). The correct cite is 803(22). 803(23) covers judgments about personal, family, or general history, or a boundary."],
