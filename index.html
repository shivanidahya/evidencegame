["Yes, under 803(23).",false,"803(23) covers judgments about personal or family history or boundaries. Convictions are 803(22)."],
["No. A criminal conviction can never be used in a civil case.",false,"803(22) is designed for exactly this kind of use."],
["Yes, even if Jake had pleaded nolo contendere to a misdemeanor.",false,"803(22) excludes nolo pleas and crimes punishable by one year or less."]],
a:["803(22): (A) after a trial or a guilty plea (not nolo); (B) punishable by death or more than 1 year; (C) to prove a fact essential to the judgment; (D) prosecutors may use it only against the accused for non-impeachment purposes.","A pending appeal may be shown but doesn’t affect admissibility.","Your notes flag “criminal convictions” as a hearsay exception topic on the final."],
r:["FRE 803(22)"]},

{id:"hs12",t:["hs","conf"],lv:2,title:"The Coconspirator’s Phone Call",
facts:"An FBI informant arranges a cocaine sale with Lonardo. On a recorded call, Lonardo tells the informant: “My friend will be the buyer — he has questions about quality.” Bourjaily shows up at the parking lot and takes the cocaine. Lonardo doesn’t testify. The prosecution offers his statements against Bourjaily.",
q:"Admissible?",
o:[["Yes. 801(d)(2)(E): the judge finds by a preponderance (104(a)) that a conspiracy existed, that Bourjaily was in it, and that the statement was made during and in furtherance of it, considering the statement itself plus independent evidence. A statement to an unwitting informant is nontestimonial, so Crawford doesn’t apply.",true,"Bourjaily lets the judge consider the statement itself (bootstrapping). The rule now requires more than the statement alone."],
["No. The conspiracy must be proved by independent evidence alone.",false,"Bourjaily rejected that. The rule says the statement “must be considered but does not by itself establish” the conspiracy."],
["No. It’s testimonial because the informant worked for the FBI.",false,"Testimonial status depends on the declarant’s perspective. Lonardo thought he was making a deal."],
["Yes, but only if the jury finds the conspiracy beyond a reasonable doubt.",false,"This is a 104(a) preliminary question for the judge, decided by a preponderance."]],
a:["801(d)(2)(E): coconspirator + during + in furtherance.","104(a): preponderance; the judge may consider the statement itself (Bourjaily) plus independent evidence (closing paragraph).","Confrontation: statements made in furtherance of a conspiracy are typically nontestimonial."],
r:["FRE 801(d)(2)(E)","FRE 104(a)"],src:"Bourjaily v. United States"},

{id:"hs13",t:["conf","hs"],lv:3,title:"The Station-House Recording",
facts:"Michael is charged with assault for stabbing Kenneth and claims self-defense. His wife Sylvia, who saw the fight, gave a recorded statement at the police station after receiving Miranda warnings as a possible suspect. Her account undercuts the self-defense claim. At trial, Sylvia invokes the marital privilege and doesn’t testify. The prosecution offers her recording under 804(b)(3).",
q:"Ruling?",
o:[["Excluded under the Confrontation Clause. The statement is testimonial (structured police questioning), Sylvia doesn’t testify, and Michael never had a chance to cross-examine her. A hearsay exception can’t cure that.",true,"Crawford: for testimonial statements, the only reliability test the Clause accepts is confrontation."],
["Admissible, because 804(b)(3) applies and she is unavailable.",false,"Satisfying the hearsay rule is necessary but not enough. Crawford adds a separate constitutional bar."],
["Admissible, because the statement interlocks with Michael’s own statement and is reliable.",false,"That was the Ohio v. Roberts reliability approach, which Crawford overruled for testimonial statements."],
["Excluded, because the marital privilege bars all of her statements.",false,"The privilege made her unavailable. It doesn’t automatically bar her out-of-court statements. The Clause does."]],
a:["Hearsay: 804(a)(1) unavailable (privilege) → 804(b)(3)?","Confrontation (criminal case): declarant isn’t the defendant and doesn’t testify → testimonial? Yes → prior opportunity to cross? No → forfeiture? No → barred.","Notes check: a testimonial statement triggers the Clause. It doesn’t exempt the statement from it."],
r:["Sixth Amendment","FRE 804(b)(3)","FRE 804(a)(1)"],src:"Crawford v. Washington"},

{id:"hs14",t:["conf","hs"],lv:2,title:"The Emergency Call",
facts:"Michelle calls 911 and says: “He’s here jumpin’ on me again… he’s usin’ his fists.” When asked who, she answers “Adrian Davis.” Davis is charged with violating a protective order. Michelle doesn’t appear at trial.",
q:"Ruling?",
o:[["Admissible. It is an excited utterance (803(2)), and it is nontestimonial because its primary purpose was to get help with an ongoing emergency, so the Confrontation Clause isn’t triggered.",true,"Davis v. Washington: the primary-purpose test. She was describing what was happening, not what had happened."],
["Barred by Crawford, because she spoke to a government agent.",false,"911 operators can be agents of the police, but the purpose of the exchange controls."],
["Admissible only under 807.",false,"803(2) fits comfortably."],
["Barred, because any statement naming the defendant is testimonial.",false,"Naming the attacker during an emergency can be part of getting help."]],
a:["Hearsay → 803(2) (or 803(1)).","Confrontation: primary purpose = an ongoing emergency → nontestimonial.","Compare Hammon: statements to officers after the emergency ended were testimonial."],
r:["FRE 803(2)","Sixth Amendment"],src:"Davis v. Washington"},

{id:"hs15",t:["hs","imp","conf"],lv:3,title:"Remembering the Identification",
facts:"Foster, a prison counselor, was beaten and suffered memory loss. Weeks later, in the hospital, he identified Owens from a photo array. At trial, Foster testifies that he remembers making the identification but can’t remember seeing his attacker. Owens argues he can’t meaningfully cross-examine Foster.",
q:"Ruling?",
o:[["Admissible. 801(d)(1)(C) covers a prior identification by a declarant who testifies and is subject to cross, and memory loss doesn’t defeat that. The Confrontation Clause is satisfied because the declarant testifies.",true,"Owens: the Clause guarantees an opportunity for effective cross-examination, not a successful one."],
["Excluded, because memory loss makes him unavailable under 804(a)(3).",false,"804(a)(3) unavailability doesn’t mean he isn’t “subject to cross-examination” under 801(d)(1)."],
["Admissible only as a recorded recollection under 803(5).",false,"An identification is its own category under 801(d)(1)(C)."],
["Excluded under the Confrontation Clause.",false,"A declarant who takes the stand and answers questions satisfies the Clause."]],
a:["801(d)(1)(C): identification of a person the declarant perceived earlier.","“Subject to cross” = he takes the stand and answers willingly.","Confrontation: declarant testifies → no problem."],
r:["FRE 801(d)(1)(C)","Sixth Amendment"],src:"United States v. Owens"},

{id:"hs16",t:["hs","conf"],lv:3,title:"The Courier’s Confession",
facts:"Harris is stopped with 19 kg of cocaine. In custody, he tells a DEA agent: “Yes, I was carrying it, but it belongs to Williamson — I’m just the driver.” At Williamson’s trial, Harris invokes the Fifth. The prosecution offers Harris’s entire statement against Williamson under 804(b)(3).",
q:"Ruling?",
o:[["Excluded. Only individually self-inculpatory remarks qualify under 804(b)(3), and blaming Williamson is collateral and self-serving (Williamson). Independently, a custodial statement to an agent is testimonial and was never cross-examined (Crawford).",true,"The rule fails at two levels: hearsay and the Constitution."],
["Admissible. The narrative as a whole is against Harris’s interest.",false,"Williamson rejected treating the whole narrative as one unit. Parse it remark by remark."],
["Admissible, because Harris is unavailable.",false,"Unavailability is only the threshold. The statement must also be against interest and survive Crawford."],
["Admissible under 801(d)(2)(E).",false,"A post-arrest confession to agents isn’t made “in furtherance” of the conspiracy."]],
a:["804(a)(1): the Fifth Amendment privilege → unavailable.","804(b)(3): sort remark by remark (Williamson). Shifting blame → not against interest.","Criminal case: corroborating circumstances are needed if offered to show criminal exposure.","Confrontation: custodial → testimonial → barred."],
r:["FRE 804(b)(3)","Sixth Amendment"],src:"Williamson v. United States"},

{id:"hs17",t:["hs","conf"],lv:2,title:"The Preliminary Hearing Witness",
facts:"At a preliminary hearing, a robbery victim testified under oath and was cross-examined by the defendant’s lawyer. Before trial, the victim died of unrelated causes. The prosecution offers the transcript.",
q:"Ruling?",
o:[["Admissible. Under 804(b)(1), it is former testimony offered against a party who had an opportunity and similar motive to examine. The Confrontation Clause is satisfied because the declarant is unavailable and the defendant had a prior opportunity to cross.",true,"This is the standard way to satisfy Crawford for a testimonial statement."],
["Excluded, because it is testimonial.",false,"Testimonial statements are admissible when the declarant is unavailable and there was a prior opportunity to cross."],
["Admissible under 801(d)(1)(A).",false,"That rule requires the declarant to testify at the current trial."],
["Excluded, because preliminary hearings never involve a similar motive.",false,"Courts usually find a similar motive. The defense can argue it had a limited tactical motive at that stage."]],
a:["804(a)(4): death → unavailable.","804(b)(1): former testimony + opportunity + similar motive.","Confrontation: testimonial, but unavailable + prior opportunity → satisfied."],
r:["FRE 804(b)(1)","FRE 804(a)(4)","Sixth Amendment"]},

{id:"hs18",t:["conf","hs"],lv:3,title:"The Killing That Silenced Her",
facts:"Giles shot his ex-girlfriend Brenda. He claims self-defense. Three weeks earlier, Brenda had told a police officer responding to a domestic-violence report that Giles choked her and threatened to kill her. The prosecution offers her statement, arguing that Giles forfeited his confrontation rights by killing her.",
q:"Ruling?",
o:[["Forfeiture applies only if Giles killed her intending to prevent her from testifying. The killing alone isn’t enough. Without that intent, her testimonial statement to police is barred.",true,"Giles v. California: forfeiture by wrongdoing requires intent to keep the witness from testifying. That matches 804(b)(6)’s “intended that result.”"],
["Forfeited, because Giles caused her unavailability.",false,"Causation isn’t enough. Intent to procure unavailability is required."],
["Admissible, because statements to responding officers are always nontestimonial.",false,"Statements describing past events once the emergency is over are testimonial (Hammon)."],
["Admissible as a dying declaration.",false,"She made the statement weeks earlier, with no belief that death was imminent."]],
a:["804(b)(6): wrongfully caused unavailability + “intended that result.”","Confrontation: testimonial → no prior cross → forfeiture requires intent (Giles).","Domestic-violence context: a pattern of isolating the victim can support intent."],
r:["FRE 804(b)(6)","Sixth Amendment"],src:"Giles v. California"},

{id:"hs19",t:["hs"],lv:2,title:"The Sleepy Driver",
facts:"A delivery driver for FreshCo crashes during his route. He tells the responding officer, “I nodded off for a second.” The injured plaintiff sues FreshCo, not the driver, and offers the statement.",
q:"Admissible against FreshCo?",
o:[["Yes. 801(d)(2)(D): a statement by the party’s employee on a matter within the scope of that relationship and while it existed.",true,"The statement concerns his driving on the route, which is within the scope of his job, and he was still employed. He didn’t need authority to speak."],
["No. The driver wasn’t authorized to speak for FreshCo.",false,"Authorization is (C). (D) requires only scope and timing."],
["No. It’s hearsay, and the driver must testify.",false,"Party statements are defined as not hearsay."],
["Yes, but only as a statement against interest.",false,"804(b)(3) would require unavailability. (D) is easier."]],
a:["(D): agency or employment + within the scope + during the relationship.","Closing paragraph: the statement must be considered, but it doesn’t by itself establish the relationship or its scope.","2024 amendment: if a party’s liability is directly derived from the declarant (a successor), the statement is admissible against that party as well."],
r:["FRE 801(d)(2)(D)"]},

{id:"hs20",t:["hs"],lv:2,title:"The Forgotten License Plate",
facts:"A warehouse guard wrote down the license plate of a getaway car in his logbook minutes after the theft. At trial, he can’t remember the plate, even after looking at the log. The prosecution offers the log entry.",
q:"Correct procedure?",
o:[["803(5) recorded recollection: the guard lacks present memory, made the record while the matter was fresh, and testifies it was accurate. The entry is read into evidence but isn’t received as an exhibit unless the adverse party offers it.",true,"Read it in, don’t hand it to the jury, unless the opponent offers it."],
["Refresh his memory under 612 and admit the log as an exhibit.",false,"Refreshing failed. And a document used under 612 isn’t evidence just because it was used."],
["Admit as a present sense impression.",false,"Possibly, but 803(5) is the precise fit, and its exhibit limit matters."],
["Excluded, because the guard has no present memory.",false,"803(5) exists for exactly this situation."]],
a:["612: refresh first; the writing isn’t evidence.","803(5): (A) once knew, now can’t recall; (B) made or adopted while fresh; (C) accurately reflects knowledge.","Read into evidence only."],
r:["FRE 803(5)","FRE 612"]},

/* ---------- MULTI-ISSUE EXAM PATTERNS ---------- */
{id:"mx1",t:["imp","hs","char","conf"],lv:3,title:"The Pharmacy Robbery",
facts:"Devon is charged with robbing a pharmacy at gunpoint. Defense: alibi. (1) Right after the robbery, the pharmacist called 911 and said, while crying: “He just ran out — tall guy, red Bulls jacket, scar on his chin!” The pharmacist has since moved abroad and won’t return. (2) Devon testifies. The prosecutor impeaches him with his 2021 felony fraud conviction. (3) The prosecutor then offers evidence that Devon robbed a gas station in 2023 “to show he does this kind of thing.”",
q:"Which set of rulings is correct?",
o:[["(1) Admissible: 803(2), and nontestimonial because it was made during an ongoing emergency. (2) Must be admitted under 609(a)(2). (3) Excluded under 404(b)(1) as propensity.",true,"Each step follows the analysis order in your notes."],
["(1) Barred by Crawford. (2) 609(a)(1)(B) balancing. (3) Admissible to show identity.",false,"(1) The statement was made to get help during an ongoing emergency, so it’s nontestimonial. (2) Fraud is crimen falsi. (3) No signature facts, so “does this kind of thing” is propensity."],
["(1) Admissible under 804(b)(1). (2) Must be admitted. (3) Excluded.",false,"804(b)(1) requires former testimony. A 911 call isn’t testimony given at a hearing or deposition."],
["(1) Admissible: 803(2). (2) Excluded under 609(b). (3) Admissible under 404(a)(2).",false,"2021 is within 10 years. 404(a)(2) belongs to the defendant to open, not the prosecutor."]],
a:["Charges: armed robbery. Defense: alibi (identity).","(1) Hearsay → 803(2) → Confrontation: primary purpose = emergency → nontestimonial → 403.","(2) Impeachment of the accused → 609(a)(2) (fraud) → no balancing.","(3) 404(b)(1) bars propensity. Identity would need a distinctive signature, plus 403 and notice."],
r:["FRE 803(2)","FRE 609(a)(2)","FRE 404(b)"]},

/* ---------- CONFRONTATION CLAUSE (Sixth Amendment) — final topic ---------- */
{id:"cf1",t:["conf"],lv:1,title:"His Own Words",
facts:"Lamar is charged with burglary. A detective testifies that after Miranda warnings, Lamar said in a recorded interview, “I went in through the back window.” Lamar does not testify. Defense counsel objects: “Confrontation Clause — my client can’t cross-examine this statement.”",
q:"Ruling on the Confrontation objection?",
o:[["Overruled. The Clause gives the accused the right to confront the witnesses against him. When the declarant is the accused himself, there is no one else to confront. The statement comes in as an opposing party’s statement.",true,"Your notes: “If defendant → not applicable. The right to confrontation doesn’t apply to the defendant who is the declarant.” Hearsay route: 801(d)(2)(A)."],
["Sustained, because the statement was testimonial: a recorded police interview.",false,"Testimonial status matters only for statements of other declarants. A defendant isn’t a “witness against” himself in the Clause’s sense."],
["Sustained unless Lamar takes the stand.",false,"Lamar can’t be forced to testify, and his own statement needs no cross-examination by him."],
["Overruled, but only because the statement is against his penal interest.",false,"804(b)(3) isn’t needed, and Lamar is available anyway. The Clause simply doesn’t apply to his own words."]],
a:["Step 1: criminal case, offered against the accused. Who is the declarant? The accused himself.","Clause not implicated; analyze under the hearsay rules (801(d)(2)(A)).","Separate issues (Miranda, voluntariness) are constitutional-criminal-procedure questions, not Confrontation."],
r:["Sixth Amendment","FRE 801(d)(2)(A)"]},

{id:"cf2",t:["conf"],lv:1,title:"The Civil Wrongful-Death Suit",
facts:"In a civil wrongful-death suit, the plaintiff offers a deceased eyewitness’s formal written statement to a police detective describing the crash. The defendant objects under the Confrontation Clause because the statement was testimonial.",
q:"Ruling on that objection?",
o:[["Overruled. The Confrontation Clause applies only “in all criminal prosecutions,” and only to the accused. In a civil case, admissibility turns on the hearsay rules.",true,"The defendant may still win on hearsay: the statement needs an exception, and 803(8) or 804 won’t easily fit."],
["Sustained, because the statement is testimonial and the declarant can’t be cross-examined.",false,"Testimonial status only matters when the Clause applies at all."],
["Sustained, because Crawford applies to all testimonial hearsay.",false,"Crawford interprets the Sixth Amendment, which is limited to criminal prosecutions."],
["Overruled, because the declarant is dead.",false,"Death makes the declarant unavailable. It wouldn’t satisfy the Clause in a criminal case without a prior opportunity to cross."]],
a:["First question on the map: criminal case, offered against the accused? No.","Clause doesn’t apply. Run hearsay: 801(c) → exception? (804(b)(1)? No prior testimony. 807?)","Keep the two analyses separate on the exam: hearsay first, then Confrontation in criminal cases."],
r:["Sixth Amendment","FRE 802"]},

{id:"cf3",t:["conf"],lv:2,title:"The Lab Certificate",
facts:"In a cocaine-trafficking prosecution, the government offers sworn “certificates of analysis” from a state lab stating that the seized bags contained 22 grams of cocaine. No analyst testifies. The certificates were prepared at police request for use at trial.",
q:"Ruling?",
o:[["Excluded under the Confrontation Clause. The certificates are testimonial (sworn statements made for use at trial), and the defendant has a right to cross-examine the analysts unless they are unavailable and he had a prior opportunity to cross.",true,"Melendez-Diaz v. Massachusetts (2009). And under Bullcoming (2011), a surrogate analyst who didn’t do or observe the test isn’t enough."],
["Admitted, because lab results are neutral, scientific business records.",false,"Melendez-Diaz rejected that argument. Records prepared for use at trial are testimonial."],
["Admitted, because the defendant could subpoena the analyst himself.",false,"The Clause puts the burden on the prosecution to present its witnesses, not on the defense to call them."],
["Admitted if another analyst from the same lab testifies about the report.",false,"Bullcoming: a surrogate who didn’t perform or observe the test doesn’t satisfy the Clause."]],
a:["Criminal + against the accused → testimonial? Yes: sworn, prepared for prosecution.","Declarant (the analyst) testifies? No. Unavailable + prior opportunity? No. Forfeiture? No → barred.","Fix: call the analyst who performed the test."],
r:["Sixth Amendment"],src:"Melendez-Diaz v. Massachusetts; Bullcoming v. New Mexico"},

{id:"cf4",t:["conf"],lv:2,title:"The Gas Station Shooting",
facts:"Police respond to a call and find Covington bleeding from a gunshot wound in a gas station parking lot. They ask what happened, who shot him, and where. Covington says, “Rick shot me through his back door, about 25 minutes ago,” then dies. The shooter’s whereabouts are unknown. At Rick’s murder trial, the statements are offered.",
q:"Testimonial?",
o:[["No. Viewed objectively, the primary purpose of the questions and answers was to meet an ongoing emergency: an armed shooter at large and a wounded victim. The statements are nontestimonial, so the Clause isn’t triggered.",true,"Michigan v. Bryant (2011). Admissibility then turns on the hearsay rules (803(2), possibly 804(b)(2))."],
["Yes. Any statement to police identifying a suspect is testimonial.",false,"Bryant looked at the whole circumstances, not just the fact that police asked who did it."],
["Yes, because the shooting happened 25 minutes earlier, so it describes past events.",false,"Davis and Bryant ask whether there is an ongoing emergency. A shooter still at large with a gun kept the emergency going."],
["The Clause doesn’t apply because Covington died.",false,"Death makes him unavailable. It doesn’t decide the testimonial question."]],
a:["Criminal + against the accused → testimonial? Apply the primary-purpose test objectively to both declarant and questioners.","Ongoing emergency factors: armed assailant at large, medical condition, informality of the questioning.","Nontestimonial → Clause not triggered → hearsay and 403 decide."],
r:["Sixth Amendment","FRE 803(2)"],src:"Michigan v. Bryant"},

{id:"cf5",t:["conf"],lv:2,title:"After the Emergency",
facts:"Officers respond to a domestic disturbance. When they arrive, things are calm. One officer keeps Hershel in the kitchen while another questions Amy in the living room. Amy describes how Hershel had shoved her into a heater, then signs a written affidavit. Amy doesn’t appear at trial.",
q:"Ruling on Amy’s statement and affidavit?",
o:[["Excluded under the Confrontation Clause. The emergency was over, and the primary purpose was to establish past events for a possible prosecution, so the statements are testimonial. Amy never faced cross-examination.",true,"Hammon v. Indiana (decided with Davis, 2006). Contrast the 911 call in Davis."],
["Admitted, because domestic-violence statements are always nontestimonial.",false,"There’s no categorical rule. The primary-purpose test decides each case."],
["Admitted as an excited utterance, which satisfies the Clause.",false,"A hearsay exception doesn’t answer the Confrontation question for a testimonial statement."],
["Admitted, because the officers were investigating, not prosecuting.",false,"Statements made to investigate past crimes for later prosecution are exactly what “testimonial” means."]],
a:["Criminal + against the accused → testimonial? Yes: separated, calm, describing what happened.","Declarant testifies? No. Unavailable + prior opportunity? No. Forfeiture? No facts showing it → barred.","Compare: Davis (911 call during the attack) → nontestimonial."],
r:["Sixth Amendment"],src:"Hammon v. Indiana (with Davis v. Washington)"},

{id:"cf6",t:["conf"],lv:2,title:"The Preschool Teacher",
facts:"A preschool teacher notices injuries on 3-year-old L.P. and asks, “Who did this?” L.P. names his mother’s boyfriend, Darius. The teacher is a mandatory reporter under state law. L.P. is found incompetent to testify. The prosecution offers the statement against Darius.",
q:"Testimonial?",
o:[["No. Statements to teachers, not police, made to address an ongoing concern for a child’s safety, by a very young child who couldn’t intend to create evidence, are nontestimonial.",true,"Ohio v. Clark (2015). Mandatory-reporting duties don’t turn teachers into law-enforcement agents for this purpose."],
["Yes, because the teacher is a mandatory reporter, so she acts as an arm of the police.",false,"Clark rejected that argument."],
["Yes, because any statement identifying an abuser is testimonial.",false,"Primary purpose, not content, decides it."],
["The Clause doesn’t apply because L.P. is incompetent to testify.",false,"Incompetence makes him unavailable. The testimonial question still has to be answered."]],
a:["Criminal + against the accused → testimonial? Who asked, why, and how formally? Who spoke?","Clark: statements to non-law-enforcement listeners are much less likely to be testimonial (not categorically excluded).","Nontestimonial → hearsay rules decide (803(2)? 807?)."],
r:["Sixth Amendment"],src:"Ohio v. Clark"},

{id:"cf7",t:["conf","hs"],lv:3,title:"The Husband Who Never Testified",
facts:"Rosa is charged with fraud for collecting life insurance after the deaths of her husband Robert and two other men. Months before he died, Robert told police that Rosa and her boyfriend had assaulted him, and he was scheduled to testify in a related case. A week before that court date, Robert was found murdered. The government offers Robert’s statements to police at Rosa’s fraud trial.",
q:"Ruling?",
o:[["Admissible if the court finds by a preponderance that Rosa wrongfully caused (or acquiesced in) Robert’s unavailability intending to prevent him from testifying. Then she forfeits both her hearsay objection (804(b)(6)) and her Confrontation objection. Her intent can concern any proceeding, not only this trial.",true,"United States v. Gray (from your notes); Giles v. California requires the intent element for the constitutional forfeiture."],
["Excluded, because Robert’s statements to police are testimonial and he was never cross-examined.",false,"That’s the starting point, but forfeiture by wrongdoing removes the objection."],
["Admissible only if Rosa killed Robert to keep him from testifying at this fraud trial specifically.",false,"Gray: the rule applies whenever the wrongdoing was intended to, and did, make the declarant unavailable as a witness, including in another proceeding."],
["Admissible automatically, because Robert is dead.",false,"Death makes him unavailable. Forfeiture requires the defendant’s wrongdoing plus intent."]],
a:["Testimonial (statements to police) + no prior cross → presumptively barred.","Forfeiture (804(b)(6) / Giles): (1) wrongdoing or acquiescence, (2) intended to make the declarant unavailable, (3) did make him unavailable; preponderance.","Gray: timing (one week before his court date) supports the inference of intent."],
r:["Sixth Amendment","FRE 804(b)(6)"],src:"United States v. Gray; Giles v. California"},

{id:"cf8",t:["conf"],lv:3,title:"The Codefendant’s Confession",
facts:"Evans and Ray are tried together for robbery. Ray, who does not testify, confessed to police: “Evans and I did the job.” The prosecutor offers the confession against Ray, and the judge instructs the jury to consider it only against Ray.",
q:"Does the limiting instruction cure the problem for Evans?",
o:[["No. A nontestifying codefendant’s confession that expressly names the defendant is so powerfully incriminating that a limiting instruction can’t cure the Confrontation violation. The fix is severance or redaction.",true,"Bruton v. United States (1968). Samia v. United States (2023): redacting the name to a neutral “the other person,” with a limiting instruction, can be permissible."],
["Yes. Juries are presumed to follow instructions.",false,"Bruton is the major exception to that presumption."],
["Yes, because the confession is admissible against Ray as his own statement.",false,"It is admissible against Ray, which is why the problem arises in a joint trial."],
["No, but only if Evans can show the confession is unreliable.",false,"Reliability isn’t the test after Crawford. The issue is the inability to cross-examine Ray."]],
a:["The statement is testimonial (a confession to police) and Ray won’t take the stand.","Against Ray: 801(d)(2)(A). Against Evans: hearsay + Confrontation problem.","Remedies: separate trials, or a redaction that doesn’t point directly to Evans (Samia)."],
r:["Sixth Amendment","FRE 105"],src:"Bruton v. United States; Samia v. United States"},

{id:"cf9",t:["conf","hs"],lv:2,title:"The Copied Confession",
facts:"At trial, Street claims his own confession was coerced: police read him his accomplice Peele’s confession and made him copy it. To rebut that claim, the prosecution has the sheriff read Peele’s confession so the jury can see how different the two are. The judge tells the jury not to consider Peele’s confession for its truth. Peele doesn’t testify.",
q:"Does this violate the Confrontation Clause?",
o:[["No. The Clause doesn’t bar using testimonial statements for purposes other than establishing the truth of the matter asserted. Here Peele’s confession was offered only for comparison, with a limiting instruction.",true,"Tennessee v. Street (1985), endorsed in Crawford footnote 9."],
["Yes, because Peele’s confession is testimonial and he didn’t testify.",false,"Testimonial, yes, but it wasn’t offered for its truth."],
["Yes, because any accomplice confession violates Bruton.",false,"Bruton concerns a codefendant’s confession offered for its truth in a joint trial."],
["No, because the defendant opened the door by claiming coercion.",false,"The reason it’s allowed is the non-truth purpose. Hemphill (2022) holds that “opening the door” doesn’t forfeit Confrontation rights."]],
a:["Not offered for truth → not hearsay (801(c)) and not a Confrontation problem (Crawford n.9).","105 limiting instruction is essential.","Watch for a pretextual “not for the truth” use (Smith v. Arizona, 2024): if a statement supports the point only if it’s true, it’s offered for its truth."],
r:["Sixth Amendment","FRE 801(c)","FRE 105"],src:"Tennessee v. Street"},

{id:"cf10",t:["conf"],lv:1,title:"Venting to a Friend",
facts:"Before she disappeared, Dana texted her best friend: “Kyle threatened me again tonight. I’m scared of him.” At Kyle’s murder trial, the prosecution offers the text. Dana is dead.",
q:"Is there a Confrontation problem?",
o:[["No. A private message to a friend, not made to establish facts for a prosecution, is nontestimonial. Admissibility turns on the hearsay rules (e.g., 803(3) for “I’m scared”; the threat itself needs its own route).",true,"Giles and Davis note that statements to friends and neighbors are generally nontestimonial."],
["Yes. Any statement accusing the defendant is testimonial.",false,"Accusation alone doesn’t make a statement testimonial."],
["Yes, because Dana is unavailable.",false,"Unavailability matters only after you find the statement testimonial."],
["No, because texts are business records.",false,"Personal texts aren’t business records. The reason is the nontestimonial purpose."]],
a:["Criminal + against the accused → testimonial? No: informal, to a friend, not for prosecution.","Clause not triggered → hearsay: “I’m scared” (803(3)); “Kyle threatened me” is a statement of memory, not 803(3) (Shepard).","Then 403."],
r:["Sixth Amendment","FRE 803(3)"],src:"Giles v. California (dicta); Davis v. Washington"},

{id:"cf11",t:["conf","hs"],lv:3,title:"Testimony at Someone Else’s Trial",
facts:"At Moe’s robbery trial, Larry testified under oath that Curly planned the robbery. Curly wasn’t a party to Moe’s trial and had no lawyer there. Larry has since died. At Curly’s trial, the prosecution offers Larry’s testimony from Moe’s trial.",
q:"Ruling?",
o:[["Excluded. The testimony is testimonial, and although Larry is unavailable, Curly never had a prior opportunity to cross-examine him. It also fails 804(b)(1), which requires an opportunity and similar motive for the party it is offered against.",true,"Both the Clause and the hearsay exception focus on whether this defendant had a chance to cross-examine."],
["Admitted, because it was given under oath and subject to cross-examination by Moe.",false,"Moe’s cross doesn’t count for Curly in a criminal case. The “predecessor in interest” idea in 804(b)(1) applies only in civil cases."],
["Admitted, because Larry is dead.",false,"Unavailability is only half of Crawford’s test."],
["Admitted under 801(d)(1)(A) as prior sworn testimony.",false,"801(d)(1) requires the declarant to testify at the current trial."]],
a:["Testimonial: yes (trial testimony is the core).","Declarant testifies? No. Unavailable + prior opportunity for THIS defendant? No. Forfeiture? No → barred.","Hearsay: 804(b)(1) fails for the same reason."],
r:["Sixth Amendment","FRE 804(b)(1)"]},

{id:"cf12",t:["conf"],lv:2,title:"Opening the Door?",
facts:"Darrell is tried for a shooting. His defense blames Morris, who had pleaded guilty to gun possession in the same incident. To rebut, the prosecution reads Morris’s plea allocution, which says Morris had a different gun. Morris is out of the country and doesn’t testify. The trial court rules that Darrell “opened the door” by blaming Morris.",
q:"Was admitting the plea allocution proper?",
o:[["No. A defendant doesn’t forfeit his Confrontation right by making an argument that the testimonial statement would rebut. Only the Clause’s own exceptions (like forfeiture by wrongdoing) remove the right.",true,"Hemphill v. New York (2022)."],
["Yes. A defendant who opens the door can’t complain about the response.",false,"That evidentiary door-opening idea can’t override the Sixth Amendment for testimonial statements."],
["Yes, because a plea allocution is nontestimonial.",false,"A plea allocution is formal testimony in court, which is plainly testimonial."],
["Yes, because Morris is unavailable.",false,"Unavailability alone isn’t enough without a prior opportunity to cross."]],
a:["Testimonial: yes (plea allocution).","Declarant testifies? No. Prior opportunity? No. Forfeiture? No.","Door-opening isn’t a Confrontation exception → barred."],
r:["Sixth Amendment"],src:"Hemphill v. New York"}
];

{id:"d_ch4",map:"character",t:["char"],lv:1,title:"The Returned Wallet",
facts:"In a theft trial, the defendant’s character witness says on direct: “Last year he found a wallet with $500 and returned it.”",
a:{k_rel:0,k_use:0,k_413:1,k_crim:0,k_form:1},
n:{k_form:"Specific instances aren’t allowed on direct (405(a)). Use reputation or opinion."}},
{id:"d_ch5",map:"character",t:["char"],lv:2,title:"Prior Sexual Assault",
facts:"In a criminal sexual-assault trial, the prosecution offers another woman’s testimony that the defendant sexually assaulted her eight years ago. There was no conviction. Proper notice was given.",
a:{k_rel:0,k_use:0,k_413:0,k_403:1},
n:{k_413:"413 permits propensity use in criminal sexual-assault cases.",k_403:"Still subject to 403. Similarity and reliable proof favor admission here."}},
{id:"d_ch6",map:"character",t:["char"],lv:1,title:"The Railroad Crossing",
facts:"Harold’s estate offers a neighbor’s testimony that for ten years Harold stopped, rolled down his window, and looked both ways at that crossing every morning. There were no eyewitnesses to the fatal crash.",
a:{k_rel:0,k_use:2,k_403:1},
n:{k_use:"A specific, regular, semi-automatic response is habit under 406. No corroboration is needed."}},

{id:"d_im1",map:"impeach",t:["imp"],lv:1,title:"The Perjury Misdemeanor",
facts:"A civil witness was convicted six years ago of misdemeanor false swearing (punishable by up to 6 months).",
a:{i_m:0,i_10:1,i_cf:0},
n:{i_10:"Six years is within the 10-year window.",i_cf:"False statement is an element → 609(a)(2), which requires admission."}},
{id:"d_im2",map:"impeach",t:["imp"],lv:2,title:"The Accused’s Drug Conviction",
facts:"Marcus, on trial for heroin distribution, testifies. Four years ago he was convicted of felony heroin distribution. The prosecutor seeks to impeach him with it.",
a:{i_m:0,i_10:1,i_cf:1,i_fel:0,i_who:0,i_bal:1},
n:{i_cf:"Drug distribution doesn’t require proving a false statement.",i_bal:"The near-identical crime creates a serious propensity risk, and drug crimes have low impeachment value. Most courts exclude. Argue both sides."}},
{id:"d_im3",map:"impeach",t:["imp"],lv:2,title:"The Padded Résumé",
facts:"On cross, a witness denies lying about a college degree on her job application. The examiner then offers the application and calls the HR director to prove the lie.",
a:{i_m:1,i_608b:0,i_ext:1},
n:{i_608b:"Lying on an application is probative of untruthfulness.",i_ext:"Extrinsic proof is barred, so the examiner takes the answer."}},
{id:"d_im4",map:"impeach",t:["imp"],lv:1,title:"Premature Bolstering",
facts:"Before any cross-examination, a party calls a pastor to vouch for its own witness’s excellent reputation for truthfulness.",
a:{i_m:2,i_608a:1,i_att:1},
n:{i_att:"Truthful character may be supported only after it has been attacked."}},
{id:"d_im5",map:"impeach",t:["imp","hs"],lv:3,title:"The Grand Jury Turncoat",
facts:"Before the grand jury, a witness testified under oath that the defendant handed him the gun. At trial he says he never saw a gun. The prosecution offers the grand jury transcript as substantive evidence.",
a:{i_m:3,i_pis:0,i_801:0,J_403:1},
n:{i_801:"Under oath at an “other proceeding” (grand jury), and the declarant now testifies and can be cross-examined. That satisfies 801(d)(1)(A).",J_403:"It goes to the central dispute; no unfair prejudice substantially outweighs it."}},
{id:"d_im6",map:"impeach",t:["imp"],lv:2,title:"Thirteen Years Later",
facts:"Trial in 2026. A witness was convicted of armed robbery in 2011 and released in 2013. The defense offers the conviction with no advance notice.",
a:{i_m:0,i_10:0,i_old:1},
n:{i_10:"The clock runs from the later of conviction or release (2013). That’s more than 10 years.",i_old:"No written notice, and no specific facts showing high probative value."}},

{id:"d_pr1",map:"privilege",t:["priv"],lv:1,title:"The Internal Investigation",src:"Upjohn",
facts:"Corporate counsel confidentially interviews mid-level managers about suspected bribes in order to give legal advice. In a federal tax investigation, the IRS subpoenas the interview notes. Nothing has been disclosed.",
a:{p_law:0,p_which:0,p_ac:0,p_cf:1,p_waive:0},
n:{p_ac:"Upjohn: employee communications at counsel’s direction to get legal advice qualify.",p_cf:"The advice concerns past conduct, not a plan for future crime."}},
{id:"d_pr2",map:"privilege",t:["priv"],lv:2,title:"The Accidental Production",
facts:"In a federal case, a firm’s privilege review misses one privileged memo among 60,000 documents. The firm demands its return promptly after discovering the error.",
a:{p_law:0,p_which:0,p_ac:0,p_cf:1,p_waive:1},
n:{p_waive:"Inadvertent, with reasonable precautions and a prompt fix → no waiver under 502(b)."}},
{id:"d_pr3",map:"privilege",t:["priv"],lv:1,title:"The Willing Wife",src:"Trammel",
facts:"In a federal drug prosecution, the defendant’s wife chooses to testify about drug transactions she saw at home. The defendant claims the spousal privilege.",
a:{p_law:0,p_which:1,p_st:1},
n:{p_which:"Her observations aren’t confidential communications, so the relevant privilege is adverse spousal testimony.",p_st:"Trammel: the witness-spouse holds the privilege, and she chooses to testify."}},
{id:"d_pr4",map:"privilege",t:["priv"],lv:2,title:"The Diversity Accountant",
facts:"A state-law contract claim is in federal court on diversity jurisdiction. The state recognizes an accountant-client privilege.",
a:{p_law:1},
n:{p_law:"501: state law supplies the rule of decision, so state privilege law applies."}},

{id:"d_hs1",map:"confront",t:["conf"],lv:3,title:"The Station-House Recording",src:"Crawford v. Washington",
facts:"Michael is charged with assault for stabbing Kenneth and claims self-defense. His wife Sylvia, who had received Miranda warnings, gave a recorded statement at the station that undercuts the self-defense claim. At trial she invokes the marital privilege. The prosecution offers her recording as a statement against penal interest.",
a:{cf_crim:0,cf_test:0,cf_avail:1,cf_prior:1,cf_exc:3},
n:{cf_test:"Structured police questioning at the station is the core of “testimonial.”",cf_avail:"Sylvia invokes privilege and never takes the stand.",cf_prior:"She is unavailable (804(a)(1)), but Michael never had a chance to cross-examine her.",cf_exc:"Her silence comes from her own privilege, not from wrongdoing by Michael. A hearsay exception (804(b)(3)) can’t cure the constitutional problem."}},
{id:"d_hs2",map:"confront",t:["conf"],lv:2,title:"The Emergency Call",src:"Davis v. Washington",
facts:"Michelle calls 911: “He’s here jumpin’ on me again… Adrian Davis.” Davis is charged with violating a protective order. Michelle doesn’t appear at trial. The prosecution offers the recording.",
a:{cf_crim:0,cf_test:1},
n:{cf_test:"Its primary purpose was to get help with an ongoing emergency, so it’s nontestimonial. The hearsay route is 803(2)."}},
{id:"d_hs7",map:"confront",t:["conf"],lv:2,title:"Preliminary Hearing Transcript",
facts:"A robbery victim testified at the preliminary hearing and was cross-examined by defense counsel. The victim died before trial. The prosecution offers the transcript.",
a:{cf_crim:0,cf_test:0,cf_avail:1,cf_prior:0},
n:{cf_test:"Testimony under oath at a hearing is testimonial.",cf_prior:"Unavailable (death) plus a prior opportunity to cross satisfies Crawford. Hearsay route: 804(b)(1)."}},
{id:"d_cf1",map:"confront",t:["conf"],lv:2,title:"The Lab Certificate",src:"Melendez-Diaz v. Massachusetts",
facts:"In a drug prosecution, the government offers sworn lab certificates stating the seized powder was cocaine. The certificates were prepared at police request for trial. No analyst testifies, and nothing shows the analysts are unavailable.",
a:{cf_crim:0,cf_test:0,cf_avail:1,cf_prior:1,cf_exc:3},
n:{cf_test:"Sworn statements prepared for use at trial are testimonial (Melendez-Diaz).",cf_prior:"No showing of unavailability and no prior cross.",cf_exc:"No forfeiture; the certificates are offered for their truth."}},
{id:"d_cf2",map:"confront",t:["conf","imp"],lv:2,title:"The Forgetful Victim",src:"United States v. Owens",
facts:"An assault victim identified the defendant to an FBI agent from a photo array while in the hospital. At trial, the victim testifies and answers questions, but says he can no longer remember the attack itself.",
a:{cf_crim:0,cf_test:0,cf_avail:0},
n:{cf_test:"An identification given to an investigating agent is testimonial.",cf_avail:"Owens: a witness who takes the stand and answers questions is subject to cross-examination, even with memory loss."}},
{id:"d_cf3",map:"confront",t:["conf","hs"],lv:3,title:"Killed Before His Court Date",src:"United States v. Gray",
facts:"The defendant’s husband told police she had assaulted him and was scheduled to testify in a related case. A week before that date, he was murdered. The court finds by a preponderance that she arranged the killing to keep him from testifying. The government offers his police statements at her later fraud trial.",
a:{cf_crim:0,cf_test:0,cf_avail:1,cf_prior:1,cf_exc:0},
n:{cf_test:"Statements to police describing past assaults are testimonial.",cf_exc:"Wrongdoing + intent to make him unavailable + he was made unavailable → forfeiture (Giles; 804(b)(6)). Gray: intent regarding any proceeding suffices."}},
{id:"d_cf4",map:"confront",t:["conf"],lv:2,title:"The Preschool Teacher",src:"Ohio v. Clark",
facts:"A 3-year-old tells his preschool teacher that his mother’s boyfriend caused his injuries. The child is found incompetent to testify. The statement is offered against the boyfriend.",
a:{cf_crim:0,cf_test:1},
n:{cf_test:"Statements to teachers aimed at protecting a child, from a very young child, are nontestimonial (Clark)."}},
{id:"d_cf5",map:"confront",t:["conf"],lv:1,title:"His Own Words",
facts:"At a burglary trial, a detective testifies that the defendant said, “I went in through the back window.” The defense raises the Confrontation Clause.",
a:{cf_crim:1},
n:{cf_crim:"The declarant is the accused. There is no other witness to confront (801(d)(2)(A))."}},
{id:"d_cf6",map:"confront",t:["conf","hs"],lv:3,title:"The Copied Confession",src:"Tennessee v. Street",
facts:"The defendant says police made him copy his accomplice’s confession. To rebut, the prosecution reads the accomplice’s confession only so the jury can compare the two, with a limiting instruction. The accomplice doesn’t testify.",
a:{cf_crim:0,cf_test:0,cf_avail:1,cf_prior:1,cf_exc:2},
n:{cf_test:"A confession to police is testimonial.",cf_exc:"Offered only to compare, not for its truth → Clause not implicated (Crawford n.9)."}},
{id:"d_cf7",map:"confront",t:["conf"],lv:1,title:"The Civil Suit",
facts:"In a civil wrongful-death suit, the plaintiff offers a deceased eyewitness’s formal statement to police. The defendant raises the Confrontation Clause.",
a:{cf_crim:2},
n:{cf_crim:"The Sixth Amendment applies only in criminal prosecutions. The hearsay rules decide."}},
{id:"d_cf8",map:"confront",t:["conf"],lv:3,title:"Killed in Anger",src:"Giles v. California",
facts:"Weeks before Giles shot his ex-girlfriend, she told a responding officer that he had choked her and threatened to kill her. Nothing suggests he killed her to keep her from testifying. The prosecution offers her statement.",
a:{cf_crim:0,cf_test:0,cf_avail:1,cf_prior:1,cf_exc:3},
n:{cf_test:"Describing past events to an officer after the emergency ended → testimonial.",cf_exc:"Forfeiture requires intent to prevent testimony (Giles). Killing her alone isn’t enough."}},
];

 "Coconspirator foundation, 804 unavailability, and forfeiture by wrongdoing are 104(a) questions for the judge.");

 ["When the relevance of evidence depends on whether a fact exists,","proof must be introduced sufficient to support a finding that the fact does exist."],
 "Conditional relevance: the judge asks only whether a reasonable jury could find the condition. The jury makes the actual call. The court may admit conditionally.",
 "Huddleston (other acts) and conditional relevance problems use this low standard.");
RL("105","Limiting evidence",
 ["If the court admits evidence that is admissible against a party or for a purpose","but not against another party or for another purpose","the court, on timely request, must restrict the evidence to its proper scope and instruct the jury accordingly."],
 "A limiting instruction confines evidence to its permitted use.",
 "Mention 105 whenever evidence comes in for a non-truth or non-propensity purpose. Counsel must request it.");
RL("106","Remainder of or related statements",
 ["If a party introduces all or part of a statement, an adverse party may require the introduction, at that time,","of any other part — or any other statement — that in fairness ought to be considered at the same time.","The adverse party may do so over a hearsay objection."],

 ["Evidence is relevant if: (a) it has any tendency to make a fact more or less probable than it would be without the evidence; and","(b) the fact is of consequence in determining the action."],

RL("404(a)(2)(B)","Exception: the victim’s pertinent trait",
 ["subject to the limitations in Rule 412, a defendant may offer evidence of an alleged victim's pertinent trait,","and if the evidence is admitted, the prosecutor may:"],
 "The prosecutor may then (i) rebut the victim’s trait and (ii) offer the defendant’s same trait.","Attacking the victim’s violence opens the door to the defendant’s violence.");
RL("404(a)(2)(C)","Exception: homicide victim’s peacefulness",
 ["in a homicide case, the prosecutor may offer evidence of the alleged victim's trait of peacefulness","to rebut evidence that the victim was the first aggressor."],
 "Triggered by any first-aggressor evidence, not only character evidence.","Homicide only.");
RL("404(a)(3)","Witness character",
 ["Evidence of a witness's character may be admitted under Rules 607, 608, and 609."],
 "Character for truthfulness is handled by the impeachment rules.","Switch to the impeachment map.");
RL("404(b)","Other crimes, wrongs, or acts",[],"(b)(1) bars propensity use. (b)(2) permits other purposes. (b)(3) requires notice in criminal cases.","State the non-propensity chain of inference explicitly.");
RL("404(b)(1)","Other acts: prohibited use",
 ["Evidence of any other crime, wrong, or act is not admissible to prove a person's character","in order to show that on a particular occasion the person acted in accordance with the character."],
 "Same ban, applied to specific acts.","“He did it before, so he did it again” is barred.");
RL("404(b)(2)","Other acts: permitted uses",
 ["motive, opportunity, intent, preparation, plan, knowledge, identity, absence of mistake, or lack of accident"],
 "Admissible for a purpose that doesn’t depend on a propensity inference. Huddleston: 104(b) sufficiency. Then 403 and 105.","Identity requires a distinctive signature (modus operandi).");
RL("404(b)(3)","Other acts: notice in a criminal case",[],
 "The prosecutor must give reasonable written notice before trial, articulating the permitted purpose and the reasoning behind it. The court may excuse pretrial notice for good cause.","Paraphrase: an easy point to pick up on an exam.");
RL("405(a)","Methods: reputation or opinion",
 ["When evidence of a person’s character or character trait is admissible,","it may be proved by testimony about the person’s reputation or by testimony in the form of an opinion.","On cross-examination of the character witness, the court may allow an inquiry into relevant specific","instances of the person’s conduct."],
 "Direct: reputation or opinion only. Cross: “have you heard / did you know” questions about specific instances, with a good-faith basis. No extrinsic proof.","Michelson.");
RL("405(b)","Methods: specific instances",
 ["When a person’s character or character trait is an essential element","of a charge, claim, or defense, the character or trait may also be proved by relevant specific instances"],
 "Character “in issue”: defamation truth, negligent entrustment, entrapment predisposition.","No propensity inference, so 404 doesn’t bar it.");
RL("406","Habit; routine practice",
 ["Evidence of a person’s habit or an organization’s routine practice may be admitted to prove","that on a particular occasion the person or organization acted in accordance with the habit or routine practice.","The court may admit this evidence regardless of whether it is corroborated or whether there was an eyewitness."],
 "Habit means specific, regular, semi-automatic behavior. Character is a general disposition.","“Always stops at that crossing” is habit. “Careful driver” is character.");
RL("407","Subsequent remedial measures",
 ["When measures are taken that would have made an earlier injury or harm less likely to occur,","evidence of the subsequent measures is not admissible to prove:","negligence;","culpable conduct;","a defect in a product or its design; or","a need for a warning or instruction.","— if disputed — proving ownership, control, or the feasibility of precautionary measures."],
 "Policy exclusion meant to encourage repairs. Other purposes (impeachment; ownership, control, or feasibility if disputed) are allowed.","Measures taken before the injury aren’t covered.");
RL("408","Compromise offers and negotiations",
 ["to prove or disprove the validity or amount of a disputed claim","to impeach by a prior inconsistent statement or a contradiction","conduct or a statement made during compromise negotiations about the claim"],
 "Settlement offers and statements made in negotiations are excluded for those purposes. Allowed for bias, negating undue delay, or obstruction.","Requires a disputed claim. A casual offer at the scene usually isn’t a 408 negotiation.");
RL("409","Offers to pay medical and similar expenses",
 ["Evidence of furnishing, promising to pay, or offering to pay medical, hospital, or similar expenses","resulting from an injury is not admissible to prove liability for the injury."],
 "Covers the offer only. Accompanying admissions are NOT protected (unlike 408).","Redact the offer; admit the admission.");
RL("410","Pleas, plea discussions, and related statements",
 ["a guilty plea that was later withdrawn;","a nolo contendere plea;","a statement made during plea discussions with an attorney for the prosecuting authority"],
 "Not admissible against the defendant who made the plea or took part in the discussions.","Discussions with police alone usually aren’t covered.");
RL("411","Liability insurance",
 ["Evidence that a person was or was not insured against liability is not admissible to prove whether the person acted negligently or otherwise wrongfully."],
 "Allowed for another purpose: bias, agency, ownership, control.","");
RL("412","Sex-offense cases: victim’s sexual behavior or predisposition",
 ["evidence offered to prove that a victim engaged in other sexual behavior","evidence offered to prove a victim’s sexual predisposition","if offered to prove that someone other than the defendant was the source of semen, injury, or other physical evidence","evidence of specific instances of a victim’s sexual behavior with respect to the person accused","evidence whose exclusion would violate the defendant’s constitutional rights","do so at least 14 days before trial unless the court, for good cause, sets a different time"],
 "Rape shield. Criminal exceptions: (b)(1)(A) other source, (B) behavior with the accused, (C) constitutionally required. Procedure: motion and in-camera hearing.","404(a)(2)(B) is expressly subject to 412.");
RL("413","Similar crimes in sexual-assault cases",
 ["the court may admit evidence that the defendant committed any other sexual assault.","The prosecutor must do so at least 15 days before trial or at a later time that the court allows for good cause."],
 "Propensity use is allowed. No conviction is required. Still subject to 403.","Your notes: “Still subject to Rule 403.”");
RL("414","Similar crimes in child-molestation cases",
 ["In a criminal case in which a defendant is accused of child molestation, the court may admit evidence that the defendant committed any other child molestation."],
 "Parallel to 413.","");
RL("415","Similar acts in civil cases (sexual assault / child molestation)",
 [],"In a civil case based on a party’s alleged sexual assault or child molestation, the court may admit evidence that the party committed another such act, considered as provided in 413 and 414.","Paraphrase.");
RL("501","Privilege in general",
 ["as interpreted by United States courts in the light of reason and experience.","state law governs privilege regarding a claim or defense for which state law supplies the rule of decision."],
 "Federal privileges are common law (Upjohn, Trammel, Jaffee). State law applies to state-law claims in civil cases.","Diversity case on a state-law claim → state privilege.");
RL("502","Attorney-client privilege and work product; limits on waiver",[],"(a) subject-matter waiver; (b) inadvertent disclosure; (d) court orders.","");
RL("502(a)","Subject-matter waiver",
 ["the waiver is intentional;","the disclosed and undisclosed communications or information concern the same subject matter; and","they ought in fairness to be considered together."],
 "All three must be met for a waiver to spread to undisclosed material.","Prevents selective, misleading disclosure.");
RL("502(b)","Inadvertent disclosure",
 ["the disclosure is inadvertent;","the holder of the privilege or protection took reasonable steps to prevent disclosure; and"],
 "Plus (3): the holder promptly took reasonable steps to rectify the error. Then there is no waiver.","Three elements: inadvertent, precautions, prompt fix.");
RL("607","Who may impeach a witness",
 ["Any party, including the party that called the witness, may attack the witness’s credibility."],
 "Abolishes the voucher rule. Limit: Ince, no impeachment as a subterfuge to get inadmissible hearsay before the jury.","Watch for the prosecutor who calls a witness only to impeach her.");
RL("608","Witness’s character for truthfulness",[],"(a) reputation or opinion; (b) specific instances on cross only.","");
RL("608(a)","Reputation or opinion evidence",
 ["may be attacked or supported by testimony about the witness's reputation","But evidence of truthful character is admissible only after the witness's character for truthfulness has been attacked."],
 "Only the truthfulness trait. No bolstering before an attack.","");
RL("608(b)","Specific instances of conduct",
 ["extrinsic evidence is not admissible to prove specific instances of a witness's conduct","the court may, on cross-examination, allow them to be inquired into"],
 "Inquiry on cross only, if probative of truthfulness. The examiner is stuck with the answer. Convictions are governed by 609.","Bias isn’t covered by 608(b), so extrinsic proof of bias is OK.");
RL("609","Impeachment by criminal conviction",[],"(a)(1) felonies with balancing; (a)(2) crimen falsi, automatic; (b) 10-year limit.","");
RL("609(a)(1)","Felony convictions",
 ["must be admitted, subject to Rule 403, in a civil case or in a criminal case in which the witness is not a defendant","must be admitted in a criminal case in which the witness is a defendant"],
 "Crimes punishable by death or more than one year. (A) Other witnesses: 403. (B) The accused: admit if probative value outweighs prejudicial effect to the defendant.","");
RL("609(a)(1)(B)","Felony conviction of the accused",
 ["must be admitted in a criminal case in which the witness is a defendant"],
 "…if the probative value outweighs its prejudicial effect to that defendant. Factors: impeachment value, timing, similarity, importance of the testimony, centrality of credibility.","Similar prior crime → exclusion is likely.");
RL("609(a)(2)","Crimen falsi",
 ["for any crime regardless of the punishment, the evidence must be admitted if the court can readily determine"],
 "…that establishing its elements required proving, or the witness admitting, a dishonest act or false statement. No balancing.","Fraud, perjury, false statement: yes. Theft or robbery alone: no.");
RL("609(b)","Convictions more than 10 years old",
 ["This subdivision (b) applies if more than 10 years have passed since the witness’s conviction","its probative value, supported by specific facts and circumstances, substantially outweighs its prejudicial effect","the proponent gives an adverse party reasonable written notice of the intent to use it"],
 "Count from the conviction or release from confinement, whichever is later. The presumption flips to exclusion.","");
RL("611(a)","Control by the court",
 ["The court should exercise reasonable control over the mode and order of examining witnesses and presenting evidence","(1) make those procedures effective for determining the truth;","(2) avoid wasting time; and","(3) protect witnesses from harassment or undue embarrassment."],
 "The general source of the judge’s control over examination, including bias impeachment.","");
RL("612","Writing used to refresh memory",
 ["This rule gives an adverse party certain options when a witness uses a writing to refresh memory","an adverse party is entitled to have the writing produced at the hearing"],
 "A refreshing writing isn’t evidence. The adverse party may inspect it, cross-examine on it, and introduce relevant portions.","Contrast 803(5): when refreshing fails, the record itself may be read in.");
RL("613","Witness’s prior statement",[],"(a) need not show the statement to the witness; (b) extrinsic evidence only after a chance to explain or deny.","");
RL("613(b)","Extrinsic evidence of a prior inconsistent statement",
 ["Unless the court orders otherwise, extrinsic evidence of a witness's prior inconsistent statement may not be admitted","until after the witness is given an opportunity to explain or deny the statement","This subdivision (b) does not apply to an opposing party's statement under Rule 801(d)(2)."],
 "Amended Dec. 1, 2024 to require the foundation BEFORE extrinsic evidence.","Impeachment use only, unless 801(d)(1)(A) applies.");
RL("801(a)","Statement",
 ["“Statement” means a person's oral assertion, written assertion, or nonverbal conduct, if the person intended it as an assertion."],
 "No intent to assert → no statement → not hearsay (FRE rejects Wright v. Tatham).","Questions, commands, and nonassertive conduct are usually not statements.");
RL("801(c)","Hearsay",
 ["“Hearsay” means a statement that: (1) the declarant does not make while testifying at the current trial or hearing; and","(2) a party offers in evidence to prove the truth of the matter asserted in the statement."],
 "Out-of-court + offered for its truth. Non-truth uses: effect on listener, verbal acts, notice, impeachment.","Ask “offered for what?” before reaching for exceptions.");
RL("801(d)","Statements that are not hearsay",[],"(d)(1) prior statements of a testifying witness; (d)(2) opposing party’s statements.","Exclusions, not exceptions. Still subject to 403.");
RL("801(d)(1)(A)","Prior inconsistent statement",
 ["is inconsistent with the declarant's testimony and was given under penalty of perjury","at a trial, hearing, or other proceeding or in a deposition;"],
 "The declarant must testify and be subject to cross. Grand jury testimony qualifies. A statement to police doesn’t.","");
RL("801(d)(1)(B)","Prior consistent statement",
 ["to rebut an express or implied charge that the declarant recently fabricated it","to rehabilitate the declarant's credibility as a witness when attacked on another ground;"],
 "(i) Tome: the statement must predate the motive. (ii) Added 2014 for other attacks, such as faulty memory.","");
RL("801(d)(1)(C)","Prior identification",
 ["identifies a person as someone the declarant perceived earlier."],"Owens: memory loss doesn’t defeat “subject to cross.”","");
RL("801(d)(2)","Opposing party’s statement",[],"(A) own; (B) adopted; (C) authorized; (D) agent or employee; (E) coconspirator. The closing paragraph adds the bootstrapping limit and the 2024 successor clause.","Only against the party.");
RL("801(d)(2)(A)","Party’s own statement",["was made by the party in an individual or representative capacity;"],"It doesn’t need to have been against interest when made.","Only when offered AGAINST that party.");
RL("801(d)(2)(D)","Agent or employee",["was made by the party's agent or employee on a matter within the scope of that relationship","and while it existed; or"],"No authority to speak is needed.","");
RL("801(d)(2)(E)","Coconspirator",["was made by the party's coconspirator during and in furtherance of the conspiracy."],
 "104(a) preponderance. The statement “must be considered but does not by itself establish” the conspiracy (Bourjaily, as codified).","Usually nontestimonial.");
RL("802","The rule against hearsay",["Hearsay is not admissible unless any of the following provides otherwise:"],"A federal statute, these rules, or other Supreme Court rules.","");
RL("803","Exceptions: availability immaterial",[],"Twenty-three exceptions that apply whether or not the declarant is available.","");
RL("803(1)","Present sense impression",["A statement describing or explaining an event or condition, made while or immediately after the declarant perceived it."],"Contemporaneity is the reliability guarantee.","");
RL("803(2)","Excited utterance",["A statement relating to a startling event or condition, made while the declarant was under the stress of excitement","that it caused."],"Stress replaces reflection. Can relate to the event, not just describe it.","Many 911 calls.");
RL("803(3)","Then-existing mental, emotional, or physical condition",
 ["A statement of the declarant's then-existing state of mind (such as motive, intent, or plan)","but not including a statement of memory or belief to prove the fact remembered or believed"],
 "Forward-looking intent is fine (Hillmon). Backward-looking belief is not (Shepard). The will exception applies.","");
RL("803(4)","Statement for medical diagnosis or treatment",
 ["is made for — and is reasonably pertinent to — medical diagnosis or treatment; and","describes medical history; past or present symptoms or sensations; their inception; or their general cause."],
 "Cause, yes. Fault and identity of the assailant, usually no (some courts allow it in abuse cases).","");
RL("803(5)","Recorded recollection",
 ["is on a matter the witness once knew about but now cannot recall well enough to testify fully and accurately;","was made or adopted by the witness when the matter was fresh in the witness’s memory; and","accurately reflects the witness’s knowledge."],
 "Read into evidence. It becomes an exhibit only if the adverse party offers it.","");
RL("803(6)","Records of a regularly conducted activity",
 ["the record was made at or near the time by — or from information transmitted by — someone with knowledge;","the record was kept in the course of a regularly conducted activity of a business, organization,","making the record was a regular practice of that activity;"],
 "(D) the custodian or another qualified witness (or a certification the rules allow) lays the foundation; (E) the opponent may show untrustworthiness. Outsiders’ statements in the record need their own exception (Johnson v. Lutz; 805).","Business records are on your final exam topic list.");
RL("803(8)","Public records",[],
 "A public office’s record of (i) its activities; (ii) matters observed under a legal duty to report, excluding matters observed by law enforcement in criminal cases; (iii) in civil cases or against the government, factual findings from a legally authorized investigation. The opponent may show untrustworthiness.","Paraphrase. Watch the criminal-case limit.");
RL("803(22)","Judgment of a previous conviction",
 ["the judgment was entered after a trial or guilty plea, but not a nolo contendere plea;","the conviction was for a crime punishable by death or by imprisonment for more than a year;","the evidence is admitted to prove any fact essential to the judgment; and"],
 "(D) a prosecutor may use it for a non-impeachment purpose only against the defendant.","Your outline lists this as 803(23). The correct cite is 803(22).");
RL("804(a)","Criteria for being unavailable",[],
 "(1) privilege; (2) refusal despite a court order; (3) lack of memory; (4) death or illness; (5) absence despite process or reasonable means. Not if the proponent wrongfully caused it.","Paraphrase.");
RL("804(a)(1)","Unavailable: privilege",[],"Exempted by a court ruling on privilege (the Fifth Amendment, the spousal privilege).","Paraphrase.");
RL("804(a)(4)","Unavailable: death or illness",[],"Can’t be present or testify because of death or a then-existing infirmity or illness.","Paraphrase.");
RL("804(b)","Exceptions when the declarant is unavailable",[],"Once 804(a) unavailability is shown: (1) former testimony, (2) statement under belief of imminent death, (3) statement against interest, (4) personal or family history, (6) forfeiture by wrongdoing.","None of these applies unless 804(a) is satisfied first.");
RL("804(b)(1)","Former testimony",
 ["was given as a witness at a trial, hearing, or lawful deposition","is now offered against a party who had — or, in a civil case, whose predecessor in interest had —","an opportunity and similar motive to develop it"],
 "Also satisfies Crawford when the declarant is unavailable.","");
RL("804(b)(2)","Statement under belief of imminent death",
 ["while believing the declarant’s death to be imminent, made about its cause or circumstances."],
 "Homicide prosecutions or civil cases only. A settled, hopeless expectation of death (Shepard). The declarant need not actually die, but must be unavailable.","");
RL("804(b)(3)","Statement against interest",
 ["a reasonable person in the declarant’s position would have made only if the person believed it to be true","is supported by corroborating circumstances that clearly indicate its trustworthiness"],
 "Parse remark by remark (Williamson). Corroboration is required in criminal cases when offered to show criminal liability (2024: consider all evidence for and against).","");
RL("804(b)(6)","Forfeiture by wrongdoing",
 ["A statement offered against a party that wrongfully caused — or acquiesced in wrongfully causing —","the declarant’s unavailability as a witness, and did so intending that result."],"Intent is required (Giles).","");
RL("805","Hearsay within hearsay",
 ["Hearsay within hearsay is not excluded by the rule against hearsay","if each part of the combined statements conforms with an exception to the rule."],"Every layer needs its own route.","Police reports, medical records quoting patients.");
RL("806","Attacking and supporting the declarant",
 ["has been admitted in evidence, the declarant’s credibility may be attacked, and then supported,","by any evidence that would be admissible for those purposes if the declarant had testified as a witness.","regardless of when it occurred or whether the declarant had an opportunity to explain or deny it."],
 "Applies to hearsay and to 801(d)(2)(C)–(E) statements.","");
RL("807","Residual exception",
 ["the statement is supported by sufficient guarantees of trustworthiness—after considering the totality of circumstances","it is more probative on the point for which it is offered than any other evidence","The statement is admissible only if the proponent gives an adverse party reasonable notice"],
 "A last resort. Notice in writing before trial (or during trial if the court excuses it for good cause).","");
// Constitutional and case-law anchors
RL("6A","Sixth Amendment: Confrontation Clause",["In all criminal prosecutions, the accused shall enjoy the right … to be confronted with the witnesses against him"],
 "Crawford: testimonial statements of a declarant who doesn’t testify are barred unless the declarant is unavailable and the defendant had a prior opportunity to cross. Nontestimonial statements fall outside the Clause.","Criminal cases, against the accused only.");
RL("Crawford","Crawford v. Washington (2004)",[],"For testimonial hearsay, the only reliability the Clause accepts is confrontation. Overruled Ohio v. Roberts for testimonial statements. Footnote 9: no problem when the declarant testifies, or when the statement isn’t offered for its truth. Footnote 6 flags dying declarations as a possible historical exception.","Notes check: “testimonial” triggers the Clause.");
RL("Davis","Davis v. Washington (2006)",[],"Primary-purpose test. Statements made to meet an ongoing emergency are nontestimonial. Statements describing past events for prosecution are testimonial (Hammon).","");
RL("Giles","Giles v. California (2008)",[],"Forfeiture requires conduct designed to prevent the witness from testifying.","");
RL("Owens","United States v. Owens (1988)",[],"A witness with memory loss who takes the stand is still subject to cross-examination for the Clause and for 801(d)(1)(C).","");
RL("Huddleston","Huddleston v. United States (1988)",[],"Other-act evidence: a 104(b) standard. Enough evidence for a jury to reasonably find the act by a preponderance.","");
RL("Upjohn","Upjohn Co. v. United States (1981)",[],"Corporate privilege covers employee communications made at counsel’s direction to secure legal advice. Rejects the control-group test.","");
RL("Zolin","United States v. Zolin (1989)",[],"Crime-fraud exception. The court may review allegedly privileged material in camera on a threshold showing.","");
RL("Trammel","Trammel v. United States (1980)",[],"The witness-spouse alone holds the adverse spousal testimony privilege.","");
RL("Jaffee","Jaffee v. Redmond (1996)",[],"Recognizes a psychotherapist-patient privilege (including licensed clinical social workers) under 501.","");

RL("Hammon","Hammon v. Indiana (2006)",[],"Decided with Davis. Statements to officers after the emergency had ended, describing past events, were testimonial.","Compare the 911 call in Davis.");
RL("Bryant","Michigan v. Bryant (2011)",[],"Primary purpose is judged objectively from the circumstances and both the declarant’s and questioners’ statements and actions. A dying victim’s answers about an armed shooter still at large were nontestimonial.","Ongoing emergency can extend beyond the victim to the public.");
RL("Melendez-Diaz","Melendez-Diaz v. Massachusetts (2009)",[],"Sworn forensic certificates prepared for use at trial are testimonial. The prosecution must produce the analyst; the defendant’s subpoena power doesn’t shift the burden.","");
RL("Bullcoming","Bullcoming v. New Mexico (2011)",[],"A surrogate analyst who didn’t perform or observe the test can’t satisfy the Clause for the certifying analyst’s report.","");
RL("Clark","Ohio v. Clark (2015)",[],"A 3-year-old’s statements to preschool teachers were nontestimonial. Statements to non-law-enforcement listeners are much less likely to be testimonial; mandatory-reporter status doesn’t change that.","");
RL("Bruton","Bruton v. United States (1968)",[],"In a joint trial, admitting a nontestifying codefendant’s confession that expressly implicates the defendant violates the Clause despite a limiting instruction. Samia v. United States (2023): a redaction to a neutral reference, with an instruction, can be permissible.","Remedies: severance or redaction.");
RL("Hemphill","Hemphill v. New York (2022)",[],"A defendant doesn’t forfeit the confrontation right by “opening the door” through argument or evidence that the testimonial statement would rebut.","");
RL("Street","Tennessee v. Street (1985)",[],"An accomplice’s confession admitted only to compare with the defendant’s, not for its truth, with a limiting instruction, didn’t violate the Clause. Crawford n.9 endorses the non-truth limit.","Smith v. Arizona (2024): if a statement supports the point only if true, it is offered for its truth.");
RL("Gray","United States v. Gray (4th Cir. 2005)",[],"804(b)(6) applies whenever the defendant’s wrongdoing was intended to, and did, make the declarant unavailable as a witness, including in a different proceeding. Findings by a preponderance.","From your notes (listed there as “Gary”).");

const CORNELL = n => "https://www.law.cornell.edu/rules/fre/rule_" + n;
// Parse any citation-ish string into {num, parts} (parts lowercased) — "FRE 803 (2)", "rule 801(d)(2)(a)", "803.2" all work.
function parseCite(s){
  s = String(s).trim();
  if (/^6A$|sixth|6th|confront/i.test(s)) return {num:"6A", parts:[]};
  const m = s.match(/(\d{3,4})\s*((?:\(\s*[a-z0-9]+\s*\)\s*)*)/i);
  if (!m) { const c = Object.keys(RULES).find(k => !/^\d/.test(k) && k !== "6A" && s.toLowerCase().includes(k.toLowerCase())); return c ? {num:c, parts:[]} : null; }
  let parts = (m[2].match(/[a-z0-9]+/gi) || []).map(p => p.toLowerCase());
  // tolerate "803.2" / "803-2" style
  if (!parts.length){ const d = s.slice(m.index + m[1].length).match(/^[.\-\s]+(\d{1,2})\b/); if (d) parts = [d[1]]; }
  return {num:m[1], parts};
}
const RULE_INDEX = {}; Object.keys(RULES).forEach(k => RULE_INDEX[k.toLowerCase()] = k);
function findRule(raw){
  const p = parseCite(raw); if (!p) return null;
  for (let n = p.parts.length; n >= 0; n--){
    const key = (p.num + p.parts.slice(0, n).map(x => "(" + x + ")").join("")).toLowerCase();
    if (RULE_INDEX[key]) return {k: RULE_INDEX[key], r: RULES[RULE_INDEX[key]]};
  }
  return null;
}
